<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3B2D">
<title>Rodízio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  =============================================================================
  RODÍZIO — ARQUIVO ÚNICO (cliente + operação)
  -----------------------------------------------------------------------------
  • Endereço normal  ........  rodizio.html            → tela das MESAS (clientes)
  • Com #operacao  ..........  rodizio.html#operacao   → tela da EQUIPE (Garçom + Cozinha/Gestão)

  A única coisa a preencher é o firebaseConfig, no primeiro <script> abaixo.
  ⚠ Protótipo sem autenticação: não usar assim em produção.
  =============================================================================
-->
</head>
<body>

<!-- ============================ TELA DAS MESAS ============================ -->
<template id="tpl-cliente">
<style>
/* =========================================================================
   TOKENS VISUAIS
   ========================================================================= */
:root{
  --forno:#1F3B2D;          /* verde-oliva profundo: marca, barras */
  --forno-2:#2C5140;
  --manjericao:#3F7D4E;     /* confirmação, disponível */
  --tomate:#E0452B;         /* ação principal: PEDIR */
  --tomate-esc:#B9331C;
  --mussarela:#F6D77A;      /* destaque: acabou de sair, mesa */
  --pedra:#E8ECE5;          /* fundo */
  --papel:#FFFFFF;
  --tinta:#18211B;
  --tinta-2:#55615A;
  --linha:#D3DAD1;
  --prato:#F2F4EF;
  --prato-borda:#C9D1C6;

  --fonte-display:'Bricolage Grotesque', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --fonte-texto:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --raio-card:18px;
  --raio-ctrl:12px;
  --raio-painel:26px;
  --barra-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  min-height:100%;
  background:var(--pedra);
  color:var(--tinta);
  font-family:var(--fonte-texto);
  font-size:16px;
  line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--barra-h) + env(safe-area-inset-bottom,0px) + 12px);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--mussarela);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}

/* =========================================================================
   TOPO
   ========================================================================= */
.topo{
  background:var(--forno);
  color:#fff;
  padding-top:env(safe-area-inset-top,0px);
  position:sticky;top:0;z-index:20;
}
.topo-inner{
  max-width:1120px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
  padding:10px clamp(12px,3vw,24px);
}
.marca{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.marca-icone{width:34px;height:34px;flex:0 0 auto}
.marca-nome{font-family:var(--fonte-display);font-weight:800;font-size:clamp(17px,2.4vw,21px);letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conexao{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.conexao i{width:8px;height:8px;border-radius:50%;background:#9AA69F;display:inline-block}
.conexao[data-estado="on"] i{background:#6FD08A;box-shadow:0 0 0 3px rgba(111,208,138,.22)}
.conexao[data-estado="off"] i{background:#F2B347;animation:pisca 1.2s infinite}
@keyframes pisca{50%{opacity:.3}}

.topo-dir{display:flex;align-items:center;gap:8px}
.mesa{display:flex;flex-direction:column;align-items:center;gap:1px}
.mesa-badge{
  background:var(--mussarela);color:var(--forno);
  font-family:var(--fonte-display);font-weight:700;font-size:15px;
  padding:5px 14px;border-radius:999px;line-height:1.2;white-space:nowrap;
}
.mesa-badge b{font-weight:800;font-size:21px;letter-spacing:-.02em;margin-left:2px}
.trocar{font-size:11px;color:rgba(255,255,255,.62);text-decoration:underline;text-underline-offset:2px;padding:2px 4px}
.icone-btn{
  position:relative;width:44px;height:44px;border-radius:50%;
  background:var(--forno-2);color:#fff;font-size:19px;font-weight:700;
  display:grid;place-items:center;flex:0 0 auto;
}
.icone-btn .ponto{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--tomate);border:2px solid var(--forno-2)}

/* =========================================================================
   CONTEÚDO
   ========================================================================= */
.conteudo{max-width:1120px;margin:0 auto;padding:14px clamp(10px,3vw,24px) 0}

/* Para sua mesa */
.recs{margin-bottom:14px}
.recs-topo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.recs h2{font-family:var(--fonte-display);font-weight:800;font-size:clamp(18px,2.4vw,22px);letter-spacing:-.01em}
.link{font-size:13px;color:var(--tinta-2);text-decoration:underline;text-underline-offset:2px;padding:4px}
.recs-lista{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none}
.recs-lista::-webkit-scrollbar{display:none}
.rec{
  flex:0 0 auto;scroll-snap-align:start;
  display:flex;align-items:center;gap:10px;
  background:var(--forno);color:#fff;border-radius:16px;
  padding:7px 8px 7px 7px;min-width:236px;max-width:290px;text-align:left;
}
.rec-img{width:54px;height:54px;flex:0 0 auto;background:rgba(255,255,255,.08);border-radius:12px;display:grid;place-items:center}
.rec-img svg{width:50px;height:50px}
.rec-txt{flex:1;min-width:0}
.rec-nome{font-weight:700;font-size:14px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-motivo{font-size:12px;color:var(--mussarela);display:block;margin-top:2px}
.rec-pedir{background:var(--tomate);color:#fff;font-weight:800;font-size:13px;letter-spacing:.03em;padding:9px 12px;border-radius:10px;flex:0 0 auto}
.recs-vazio{font-size:14px;color:var(--tinta-2);padding:6px 0}

/* Abas de categoria */
.abas{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
  background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:5px;margin-bottom:12px;
}
.aba{
  border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-weight:700;font-size:13px;color:var(--tinta-2);line-height:1.15;text-align:center;
}
.aba .aba-emoji{font-size:22px;line-height:1}
.aba[aria-selected="true"]{background:var(--forno);color:#fff}
@media (min-width:640px){
  .aba{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:11px 8px}
}

/* Páginas de produtos: 3 colunas × 2 linhas */
.cardapio{position:relative}
.pager{
  display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scrollbar-width:none;overscroll-behavior-x:contain;scroll-behavior:auto;
}
.pager::-webkit-scrollbar{display:none}
.pagina{
  flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,auto);
  gap:clamp(8px,1.6vw,16px);padding:2px;
}
.card{
  background:var(--papel);border:1px solid var(--linha);border-radius:var(--raio-card);
  padding:clamp(8px,1.4vw,14px);display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;
}
.card-img{position:relative;height:clamp(84px,min(19vw,19vh),158px);display:grid;place-items:center;margin-bottom:2px}
.card-img svg{height:100%;width:auto;max-width:100%;transition:filter .3s,opacity .3s}
.card.esgotado .card-img svg{filter:grayscale(1);opacity:.32}
.selo{
  position:absolute;left:-2px;top:0;
  background:var(--mussarela);color:var(--forno);
  font-weight:800;font-size:clamp(9px,1.2vw,12px);letter-spacing:.02em;
  padding:3px 7px;border-radius:8px;transform:rotate(-4deg);white-space:nowrap;
  box-shadow:0 2px 0 rgba(31,59,45,.18);
}
.card-nome{
  font-family:var(--fonte-display);font-weight:700;font-size:clamp(13px,1.7vw,17px);line-height:1.2;letter-spacing:-.005em;
  min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-disp{font-size:clamp(11.5px,1.4vw,14px);color:var(--tinta-2);line-height:1.25;min-height:2.5em}
.card-disp.ok{color:var(--manjericao);font-weight:600}
.card-disp.ok b{font-size:1.25em;font-weight:800}
.card-disp.esg{color:var(--tinta-2);font-weight:800;font-size:clamp(10px,1.2vw,12.5px);letter-spacing:.01em}
.btn-pedir{
  margin-top:auto;min-height:44px;border-radius:var(--raio-ctrl);
  background:var(--tomate);color:#fff;font-weight:800;font-size:clamp(13px,1.6vw,16px);letter-spacing:.05em;
  padding:6px 4px;line-height:1.1;
  transition:transform .08s, background .15s;
}
.btn-pedir:active{transform:scale(.97);background:var(--tomate-esc)}
.btn-pedir.sec{background:var(--forno);font-size:clamp(11px,1.35vw,14px);letter-spacing:.02em}
.btn-pedir:disabled{background:#CDD3CB;color:#6F7A72}
.btn-naorec{font-size:clamp(10.5px,1.25vw,12.5px);color:var(--tinta-2);padding:4px 2px 0;line-height:1.2}
.btn-naorec.on{color:var(--forno);font-weight:700}

.pager-nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 0 4px}
.seta{width:44px;height:44px;border-radius:50%;background:var(--papel);border:1px solid var(--linha);font-size:26px;line-height:1;color:var(--forno);display:grid;place-items:center;padding-bottom:3px}
.seta:disabled{opacity:.35}
.dots{display:flex;gap:8px}
.dot{width:10px;height:10px;border-radius:999px;background:#BFC8BD;transition:width .2s,background .2s;padding:0}
.dot[aria-current="true"]{width:28px;background:var(--forno)}
.pagina-rotulo{font-size:12px;color:var(--tinta-2);text-align:center;margin-top:2px}

/* Pizza SVG */
.prato{fill:var(--prato);stroke:var(--prato-borda);stroke-width:1.5}
.fatia-vazia{fill:var(--prato);stroke:var(--prato-borda);stroke-width:1.4;stroke-dasharray:4 4}

/* =========================================================================
   BARRA FIXA: MEUS PEDIDOS
   ========================================================================= */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:var(--forno);padding:8px clamp(10px,3vw,24px) calc(8px + env(safe-area-inset-bottom,0px));
}
.barra-btn{
  max-width:1120px;margin:0 auto;width:100%;min-height:52px;
  display:flex;align-items:center;gap:12px;color:#fff;text-align:left;
  background:var(--forno-2);border-radius:14px;padding:6px 14px;
}
.barra-ic{font-size:22px}
.barra-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.barra-txt strong{font-family:var(--fonte-display);font-size:17px;font-weight:800}
.barra-txt span{font-size:13px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-badge{background:var(--tomate);color:#fff;font-weight:800;min-width:28px;height:28px;border-radius:999px;display:grid;place-items:center;padding:0 8px;font-size:14px}
.barra-abrir{font-weight:800;color:var(--mussarela);font-size:14px}

/* =========================================================================
   CAMADAS (telas sobrepostas)
   ========================================================================= */
.camada{
  position:fixed;inset:0;z-index:50;background:rgba(16,28,21,.58);
  display:flex;align-items:flex-end;justify-content:center;
  animation:aparecer .18s ease-out;
}
@keyframes aparecer{from{opacity:0}}
.painel{
  background:var(--papel);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  border-radius:var(--raio-painel) var(--raio-painel) 0 0;
  padding:22px clamp(16px,4vw,28px) calc(20px + env(safe-area-inset-bottom,0px));
  animation:subir .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes subir{from{transform:translateY(40px);opacity:.4}}
@media (min-width:720px){
  .camada{align-items:center}
  .painel{border-radius:var(--raio-painel);padding-bottom:24px}
}
.painel h2{font-family:var(--fonte-display);font-weight:800;font-size:clamp(22px,3.4vw,28px);letter-spacing:-.015em;line-height:1.15}
.painel .sub{color:var(--tinta-2);margin-top:4px}
.fechar{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--pedra);font-size:20px;display:grid;place-items:center}
.painel-rel{position:relative}

.btn-primario{
  width:100%;min-height:56px;border-radius:14px;background:var(--tomate);color:#fff;
  font-weight:800;font-size:18px;letter-spacing:.04em;padding:10px 16px;
}
.btn-primario:disabled{background:#CDD3CB;color:#6F7A72}
.btn-sec{min-height:56px;border-radius:14px;background:var(--pedra);font-weight:700;font-size:16px;padding:10px 18px}

/* Seleção de mesa */
.tela-mesa{background:var(--forno);align-items:center;overflow:auto;padding:24px 16px}
.mesa-box{width:100%;max-width:560px;color:#fff;text-align:center}
.mesa-box .marca-grande{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--fonte-display);font-weight:800;font-size:22px;margin-bottom:26px;color:var(--mussarela)}
.mesa-box h1{font-family:var(--fonte-display);font-weight:800;font-size:clamp(30px,6vw,42px);letter-spacing:-.02em;line-height:1.1}
.mesa-box p{color:rgba(255,255,255,.75);margin-top:8px}
.mesas-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px}
.mesa-op{
  aspect-ratio:1;border-radius:18px;background:var(--forno-2);color:#fff;
  font-family:var(--fonte-display);font-weight:800;font-size:clamp(22px,5vw,32px);
  border:2px solid transparent;
}
.mesa-op:active{background:var(--mussarela);color:var(--forno)}
.mesa-op[aria-current="true"]{border-color:var(--mussarela)}
.mesa-voltar{margin-top:20px;color:rgba(255,255,255,.8);text-decoration:underline;padding:8px}

/* Como funciona */
.passos{list-style:none;margin:18px 0 14px;display:grid;gap:12px;counter-reset:p}
.passos li{display:flex;gap:14px;align-items:flex-start;font-size:17px;font-weight:600;line-height:1.35}
.passos li::before{
  counter-increment:p;content:counter(p);
  flex:0 0 34px;height:34px;border-radius:50%;background:var(--forno);color:var(--mussarela);
  font-family:var(--fonte-display);font-weight:800;display:grid;place-items:center;font-size:17px;
}
.nota{background:#FFF6D9;border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:18px}

/* Folha de quantidade */
.qtd-cabeca{display:flex;align-items:center;gap:14px;padding-right:44px}
.qtd-img{width:84px;height:84px;flex:0 0 auto}
.qtd-img svg{width:100%;height:100%}
.qtd-cat{font-size:13px;color:var(--tinta-2);font-weight:600}
.qtd-info{margin:16px 0 10px;font-size:15px;color:var(--tinta-2)}
.qtd-info b{color:var(--manjericao)}
.qtd-pergunta{font-weight:800;font-size:17px;margin-bottom:10px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:480px){.chips{grid-template-columns:repeat(8,1fr)}}
.chips.poucos{grid-template-columns:repeat(6,1fr)}
.chip{
  min-height:52px;border-radius:12px;background:var(--pedra);border:2px solid transparent;
  font-family:var(--fonte-display);font-weight:800;font-size:21px;
}
.chip[aria-pressed="true"]{background:var(--forno);color:#fff}
.chip:disabled{opacity:.28;text-decoration:line-through}
.aviso{margin-top:12px;background:#FFE9E3;color:#8E2A17;border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
.aviso.bom{background:#E2F2E5;color:#23592F}
.qtd-acoes{display:flex;gap:10px;margin-top:18px}
.qtd-acoes .btn-sec{flex:0 0 auto}
.qtd-acoes .btn-primario{flex:1}

/* Meus pedidos */
.pedidos-grupo{margin-top:18px}
.pedidos-grupo h3{font-size:14px;font-weight:800;color:var(--tinta-2);margin-bottom:8px}
.pedido{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--linha)}
.pedido-emoji{font-size:28px;grid-row:span 2}
.pedido-nome{font-weight:700;line-height:1.2}
.pedido-qtd{font-size:14px;color:var(--tinta-2)}
.pedido-status{justify-self:end;font-weight:800;font-size:11.5px;letter-spacing:.03em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pedido-dica{grid-column:2 / span 2;font-size:13px;color:var(--tinta-2)}
.pedido-acao{grid-column:2 / span 2;display:flex;justify-content:flex-start}
.btn-cancelar{font-size:14px;font-weight:700;color:var(--tomate-esc);padding:6px 0}
.btn-cancelar.confirmar{background:var(--tomate);color:#fff;padding:7px 12px;border-radius:10px}
.st-SOLICITADO{background:#E1EBF6;color:#23507D}
.st-EM_ATENDIMENTO{background:#FCEBC0;color:#7A5200}
.st-ATENDIDO{background:#DDF0E1;color:#23592F}
.st-AGUARDANDO_REPOSICAO{background:#ECE4F6;color:#5B3F8A}
.st-CANCELADO{background:#ECEEEA;color:#6A736D}
.vazio{text-align:center;padding:26px 8px;color:var(--tinta-2)}
.vazio strong{display:block;color:var(--tinta);font-size:17px;margin-bottom:4px}

/* Atividade */
.lateral{justify-content:flex-end;align-items:stretch}
.lateral .painel{max-width:420px;max-height:none;height:100%;border-radius:var(--raio-painel) 0 0 var(--raio-painel);animation:lado .22s cubic-bezier(.2,.8,.2,1);padding-top:calc(22px + env(safe-area-inset-top,0px))}
@keyframes lado{from{transform:translateX(40px);opacity:.4}}
.feed{list-style:none;margin-top:16px}
.feed li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linha);align-items:flex-start}
.feed .f-emoji{font-size:24px;line-height:1.1}
.feed .f-txt{flex:1;font-weight:600;line-height:1.3}
.feed .f-hora{display:block;font-weight:400;font-size:13px;color:var(--tinta-2);margin-top:2px}

/* Confirmação e prioridade */
.centro{align-items:center;padding:20px}
.confirma{
  background:var(--papel);border-radius:28px;padding:30px 26px 26px;max-width:380px;width:100%;text-align:center;
  animation:pop .28s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.confirma .selo-ok{width:76px;height:76px;border-radius:50%;background:var(--manjericao);color:#fff;font-size:42px;font-weight:800;display:grid;place-items:center;margin:0 auto 14px}
.confirma h2{font-family:var(--fonte-display);font-weight:800;font-size:26px;letter-spacing:-.015em}
.confirma p{margin-top:8px;font-size:17px;color:var(--tinta-2)}
.confirma p b{color:var(--tinta)}
.confirma.fogo{background:var(--forno);color:#fff}
.confirma.fogo .selo-ok{background:var(--mussarela);color:var(--forno)}
.confirma.fogo p{color:rgba(255,255,255,.85)}
.confirma.fogo p b{color:#fff}
.confirma .btn-primario{margin-top:18px}

/* Aviso de configuração pendente */
.tela-config{background:var(--forno);align-items:center;color:#fff;text-align:center;padding:24px}
.tela-config .box{max-width:440px}
.tela-config h1{font-family:var(--fonte-display);font-weight:800;font-size:28px;margin:14px 0 8px}
.tela-config p{color:rgba(255,255,255,.8)}
.tela-config small{display:block;margin-top:18px;color:rgba(255,255,255,.5);font-size:12px}

/* Toasts */
.toasts{
  position:fixed;left:0;right:0;z-index:70;pointer-events:none;
  bottom:calc(var(--barra-h) + env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;
}
.toast{
  pointer-events:auto;background:var(--tinta);color:#fff;border-radius:14px;padding:12px 14px;
  max-width:520px;width:100%;display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;
  box-shadow:0 10px 28px rgba(16,28,21,.28);animation:subir .2s ease-out;
}
.toast span{flex:1}
.toast button{color:var(--mussarela);font-weight:800;padding:4px 6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

     TOPO
     ========================================================================= -->
<header class="topo">
  <div class="topo-inner">
    <div class="marca">
      <svg class="marca-icone" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 4 L36 34 Q20 40 4 34 Z" fill="#F6D77A"/>
        <path d="M4 34 Q20 40 36 34 L34.4 31 Q20 36.6 5.6 31 Z" fill="#D38C45"/>
        <circle cx="19" cy="18" r="3" fill="#E0452B"/><circle cx="14" cy="27" r="3" fill="#E0452B"/><circle cx="25" cy="28" r="3" fill="#E0452B"/>

      <div style="min-width:0">
        <div class="marca-nome" id="marcaNome">Rodízio</div>
        <div class="conexao" id="conexao" data-estado="conectando" aria-live="polite"><i></i><span>Conectando…</span></div>

</header>

<!-- =========================================================================

<main class="conteudo">
  <section class="recs" id="recs" aria-labelledby="recsTitulo">

      <h2 id="recsTitulo">✨ Para sua mesa</h2>
      <button class="link" id="btnRestaurar" type="button" hidden></button>
    </div>
    <div class="recs-lista" id="recsLista"></div>
  </section>

      <div class="dots" id="dots"></div>
      <button class="seta" id="pgProx" type="button" aria-label="Próxima página">›</button>

</main>

<div class="barra">

    <span class="barra-ic" aria-hidden="true">🧾</span>
    <span class="barra-txt"><strong>Meus pedidos</strong><span id="barraResumo">Nenhum pedido ainda</span></span>
    <span class="barra-badge" id="barraBadge" hidden>0</span>
    <span class="barra-abrir">Ver</span>
  </button>
</div>

     CAMADAS

<!-- Seleção de mesa -->
<div class="camada tela-mesa" id="telaMesa" hidden role="dialog" aria-modal="true" aria-labelledby="telaMesaTitulo">
  <div class="mesa-box">
    <div class="marca-grande" id="marcaGrande">🍕 Rodízio</div>
    <h1 id="telaMesaTitulo">Em qual mesa você está?</h1>
    <p>Toque no número da sua mesa.</p>
    <div class="mesas-grid" id="mesasGrid"></div>
    <button class="mesa-voltar" id="mesaVoltar" type="button" hidden>Voltar ao cardápio</button>
  </div>
</div>

<!-- Como funciona -->
<div class="camada" id="telaComo" hidden role="dialog" aria-modal="true" aria-labelledby="comoTitulo">
  <div class="painel painel-rel">
    <h2 id="comoTitulo">Como funciona</h2>
    <ol class="passos">
      <li>Escolha o que você gostaria de receber.</li>
      <li>Escolha a quantidade.</li>
      <li>Toque em PEDIR.</li>
      <li>O garçom verá sua solicitação e realizará o atendimento.</li>
    </ol>
    <p class="nota">Pedir significa avisar ao garçom que sua mesa gostaria de receber esse produto.</p>
    <button class="btn-primario" id="comoOk" type="button">ENTENDI</button>
  </div>
</div>

<!-- Quantidade -->
<div class="camada" id="telaQtd" hidden role="dialog" aria-modal="true" aria-labelledby="qtdNome">
  <div class="painel painel-rel">
    <button class="fechar" type="button" data-fechar="telaQtd" aria-label="Fechar">✕</button>
    <div class="qtd-cabeca">
      <div class="qtd-img" id="qtdImg"></div>
      <div>
        <div class="qtd-cat" id="qtdCat"></div>
        <h2 id="qtdNome"></h2>
      </div>
    </div>
    <p class="qtd-info" id="qtdInfo"></p>
    <p class="qtd-pergunta" id="qtdPergunta"></p>
    <div class="chips" id="qtdChips"></div>
    <p class="aviso" id="qtdAviso" hidden></p>
    <div class="qtd-acoes">
      <button class="btn-sec" type="button" data-fechar="telaQtd">Voltar</button>
      <button class="btn-primario" id="qtdConfirmar" type="button">PEDIR</button>
    </div>
  </div>
</div>

<!-- Meus pedidos -->
<div class="camada" id="telaPedidos" hidden role="dialog" aria-modal="true" aria-labelledby="pedidosTitulo">
  <div class="painel painel-rel">
    <button class="fechar" type="button" data-fechar="telaPedidos" aria-label="Fechar">✕</button>
    <h2 id="pedidosTitulo">Meus pedidos</h2>
    <p class="sub" id="pedidosSub"></p>
    <div id="pedidosLista"></div>
  </div>
</div>

<!-- Atividade do rodízio -->
<div class="camada lateral" id="telaAtividade" hidden role="dialog" aria-modal="true" aria-labelledby="atividadeTitulo">
  <div class="painel painel-rel">
    <button class="fechar" type="button" data-fechar="telaAtividade" aria-label="Fechar">✕</button>
    <h2 id="atividadeTitulo">Atividade do rodízio</h2>
    <p class="sub">O que está acontecendo no salão agora.</p>
    <ul class="feed" id="feed"></ul>
  </div>
</div>

<!-- Confirmar troca de mesa -->
<div class="camada centro" id="telaTrocar" hidden role="dialog" aria-modal="true" aria-labelledby="trocarTitulo">
  <div class="confirma">
    <h2 id="trocarTitulo">Trocar de mesa?</h2>
    <p id="trocarTexto">Os pedidos já feitos continuam registrados na mesa atual.</p>
    <button class="btn-primario" id="trocarSim" type="button">ESCOLHER OUTRA MESA</button>
    <button class="btn-sec" style="width:100%;margin-top:10px" type="button" data-fechar="telaTrocar">Continuar nesta mesa</button>
  </div>
</div>

<!-- Confirmação de pedido / prioridade -->
<div class="camada centro" id="telaOk" hidden role="alertdialog" aria-modal="true" aria-labelledby="okTitulo">
  <div class="confirma" id="okCaixa">
    <div class="selo-ok" id="okIcone">✓</div>
    <h2 id="okTitulo">Solicitação registrada</h2>
    <p id="okTexto"></p>
    <button class="btn-primario" id="okFechar" type="button">OK</button>
  </div>
</div>

<!-- Configuração pendente (somente quando o firebaseConfig não foi preenchido) -->
<div class="camada tela-config" id="telaConfig" hidden>
  <div class="box">
    <div style="font-size:54px">🍕</div>
    <h1>Cardápio em preparação</h1>
    <p>O cardápio digital desta mesa ainda está sendo preparado. Por favor, chame um atendente.</p>
    <small>Configuração pendente</small>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<noscript><p style="padding:20px">Ative o JavaScript para usar o cardápio da mesa.</p></noscript>

</template>

<!-- ============================ TELA DA EQUIPE ============================ -->
<template id="tpl-operacao">
<style>
/* =========================================================================
   TOKENS VISUAIS (mesma identidade do cliente.html)
   ========================================================================= */
:root{
  --forno:#1F3B2D; --forno-2:#2C5140; --forno-3:#3A6350;
  --manjericao:#3F7D4E; --tomate:#E0452B; --tomate-esc:#B9331C; --mussarela:#F6D77A;
  --pedra:#E8ECE5; --papel:#FFFFFF; --tinta:#18211B; --tinta-2:#55615A; --linha:#D3DAD1;

  --c-sol:#E07B1F;      /* SOLICITADO: laranja */
  --c-sol-bg:#FDEBD8;
  --c-em:#2F6FB0;       /* EM ATENDIMENTO: azul */
  --c-em-bg:#E1ECF7;
  --c-ok:#3F7D4E;       /* ATENDIDO */
  --c-ok-bg:#DDF0E1;
  --c-agu:#6B4C9A;      /* AGUARDANDO REPOSIÇÃO */
  --c-agu-bg:#ECE4F6;
  --c-can:#6A736D;
  --c-can-bg:#ECEEEA;

  --fonte-display:'Bricolage Grotesque', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --fonte-texto:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--pedra);color:var(--tinta);font-family:var(--fonte-texto);font-size:15px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--mussarela);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}

/* =========================================================================
   TOPO
   ========================================================================= */
.topo{background:var(--forno);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.topo-inner{max-width:1480px;margin:0 auto;padding:10px clamp(12px,2.4vw,28px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.marca svg{width:32px;height:32px}
.marca b{font-family:var(--fonte-display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:block;line-height:1.1}
.marca small{font-size:12px;color:rgba(255,255,255,.65)}
.modos{display:flex;background:var(--forno-2);border-radius:14px;padding:4px;gap:4px;order:3;width:100%}
@media (min-width:860px){.modos{order:0;width:auto}}
.modo{flex:1;padding:10px 18px;border-radius:10px;font-weight:800;font-size:15px;color:rgba(255,255,255,.75);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px}
.modo[aria-selected="true"]{background:var(--mussarela);color:var(--forno)}
.modo .qtd-badge{background:var(--tomate);color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.topo-dir{display:flex;align-items:center;gap:8px}
.conexao{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.8);padding:0 6px}
.conexao i{width:9px;height:9px;border-radius:50%;background:#9AA69F;display:inline-block}
.conexao[data-estado="on"] i{background:#6FD08A;box-shadow:0 0 0 3px rgba(111,208,138,.22)}
.conexao[data-estado="off"] i{background:#F2B347;animation:pisca 1.2s infinite}
@keyframes pisca{50%{opacity:.3}}
.relogio{font-family:var(--fonte-display);font-weight:700;font-size:17px;color:var(--mussarela);padding:0 4px}
.btn-topo{height:40px;padding:0 12px;border-radius:12px;background:var(--forno-2);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.btn-topo[aria-pressed="true"]{background:var(--forno-3);box-shadow:inset 0 0 0 2px var(--mussarela)}

.conteudo{max-width:1480px;margin:0 auto;padding:16px clamp(12px,2.4vw,28px) 40px}

/* =========================================================================
   MODO GARÇOM
   ========================================================================= */
.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.res{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.res b{font-family:var(--fonte-display);font-weight:800;font-size:clamp(26px,3.4vw,36px);line-height:1}
.res span{font-weight:700;color:var(--tinta-2);font-size:14px;line-height:1.2}
.res.sol{border-left:6px solid var(--c-sol)} .res.em{border-left:6px solid var(--c-em)} .res.agu{border-left:6px solid var(--c-agu)}

.ferramentas{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:flex;background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:3px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--tinta-2)}
.seg button[aria-pressed="true"]{background:var(--forno);color:#fff}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtro{padding:8px 12px;border-radius:999px;background:var(--papel);border:1px solid var(--linha);font-weight:700;font-size:14px;color:var(--tinta-2)}
.filtro[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}

.bloco{margin-bottom:22px}
.bloco-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.bloco-cab h2{font-family:var(--fonte-display);font-weight:800;font-size:clamp(19px,2.2vw,23px);letter-spacing:-.01em}
.bloco-cab .cont{font-weight:800;color:var(--tinta-2)}
.bloco.prio{background:#FFF4D6;border:2px solid var(--mussarela);border-radius:20px;padding:14px}
.bloco.prio .bloco-cab h2{color:#8A3A10}

.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ticket{
  display:grid;grid-template-columns:96px 1fr;background:var(--papel);border:1px solid var(--linha);
  border-radius:16px;overflow:hidden;min-height:150px;position:relative;
}
.ticket-mesa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#fff;background:var(--c-sol);padding:10px 4px;text-align:center}
.ticket-mesa small{font-weight:800;font-size:12px;letter-spacing:.08em;opacity:.9}
.ticket-mesa b{font-family:var(--fonte-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.ticket.st-EM_ATENDIMENTO .ticket-mesa{background:var(--c-em)}
.ticket.st-AGUARDANDO_REPOSICAO .ticket-mesa{background:var(--c-agu)}
.ticket.st-ATENDIDO .ticket-mesa{background:var(--c-ok)}
.ticket.prioridade .ticket-mesa{background:var(--tomate)}
.ticket-corpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ticket-topo{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--tinta-2);font-weight:600}
.espera.medio{color:#A15C00;font-weight:800}
.espera.alto{color:var(--tomate-esc);font-weight:800}
.ticket h3{font-family:var(--fonte-display);font-weight:700;font-size:18px;line-height:1.2;letter-spacing:-.005em}
.ticket-qtd{font-family:var(--fonte-display);font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1.1}
.ticket-prio{font-weight:800;font-size:12.5px;color:var(--tomate-esc)}
.ticket-acoes{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:8px}
.acao{flex:1;min-height:46px;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:.04em;color:#fff;background:var(--c-sol);padding:6px 10px}
.acao.concluir{background:var(--c-em)}
.acao:active{transform:scale(.98)}
.cancelar-adm{font-size:13px;font-weight:700;color:var(--tinta-2);text-decoration:underline;text-underline-offset:2px;padding:6px 2px;white-space:nowrap}
.cancelar-adm.confirmar{background:var(--tomate);color:#fff;text-decoration:none;border-radius:10px;padding:8px 10px}
.ticket.novo{animation:chegou 1.2s ease-out 2}
@keyframes chegou{0%{box-shadow:0 0 0 0 rgba(224,69,43,.55)}100%{box-shadow:0 0 0 14px rgba(224,69,43,0)}}

.chip{display:inline-block;font-weight:800;font-size:11.5px;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.st-SOLICITADO{background:var(--c-sol-bg);color:#8A4A08}
.chip.st-EM_ATENDIMENTO{background:var(--c-em-bg);color:#1F4F80}
.chip.st-ATENDIDO{background:var(--c-ok-bg);color:#23592F}
.chip.st-AGUARDANDO_REPOSICAO{background:var(--c-agu-bg);color:#523879}
.chip.st-CANCELADO{background:var(--c-can-bg);color:var(--c-can)}

/* Aguardando reposição agrupado */
.aguarda{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.ag-grupo{background:var(--papel);border:1px dashed #B79CE0;border-radius:14px;padding:10px 12px}
.ag-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;margin-bottom:6px}
.ag-linha{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--linha);flex-wrap:wrap}
.ag-linha b{font-family:var(--fonte-display);font-size:17px}
.ag-linha .seta{color:var(--tinta-2)}
.ag-linha .dir{margin-left:auto;display:flex;align-items:center;gap:8px}
.tag{font-weight:800;font-size:11.5px;letter-spacing:.03em;padding:3px 8px;border-radius:8px;white-space:nowrap}
.tag.esg{background:#2B2F2C;color:#fff}
.tag.fogo{background:var(--mussarela);color:#7A3200}
.tag.pouca{background:#FDE3C3;color:#8A4A08}
.tag.livre{background:var(--c-ok-bg);color:#23592F}

.recentes{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:4px 14px}
.recentes li{list-style:none;display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--linha);font-size:14px}
.recentes li:first-child{border-top:0}
.recentes .hora{color:var(--tinta-2);font-weight:700;min-width:44px}

.vazio{background:var(--papel);border:1px dashed var(--linha);border-radius:16px;padding:28px 16px;text-align:center;color:var(--tinta-2)}
.vazio strong{display:block;color:var(--tinta);font-size:17px;margin-bottom:4px;font-family:var(--fonte-display)}

/* Visão por produto */
.grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.grupo{background:var(--papel);border:1px solid var(--linha);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.grupo.tem-prio{border:2px solid var(--tomate)}
.grupo-cab{padding:12px 14px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.grupo-cab h3{font-family:var(--fonte-display);font-weight:800;font-size:17px;letter-spacing:.01em;text-transform:uppercase;line-height:1.2}
.grupo-total{font-family:var(--fonte-display);font-weight:800;font-size:22px;margin-top:2px}
.grupo-total span{font-size:15px;color:var(--tinta-2);font-weight:700}
.grupo ul{list-style:none;padding:4px 14px}
.linha-g{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--linha);flex-wrap:wrap}
.linha-g:first-child{border-top:0}
.linha-g .mesa-g{font-family:var(--fonte-display);font-weight:800;font-size:17px;min-width:76px}
.linha-g .qtd-g{font-weight:800}
.linha-g .dir{margin-left:auto;display:flex;align-items:center;gap:8px}
.mini{min-height:36px;padding:4px 12px;border-radius:10px;font-weight:800;font-size:13px;letter-spacing:.03em;color:#fff;background:var(--c-sol)}
.mini.concluir{background:var(--c-em)}
.grupo-rodape{margin-top:auto;display:flex;gap:8px;padding:10px 14px 14px;flex-wrap:wrap}
.grupo-rodape .acao{min-height:42px;font-size:14px}

/* =========================================================================
   MODO COZINHA / GESTÃO
   ========================================================================= */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px 14px}
.kpi h3{font-size:13px;font-weight:800;color:var(--tinta-2);letter-spacing:.02em}
.kpi b{display:block;font-family:var(--fonte-display);font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin-top:4px}
.kpi small{color:var(--tinta-2);font-size:12.5px}

/* ---------------------------------------------------------------------------

   --------------------------------------------------------------------------- */
const MODO_OPERACAO = location.hash.replace("#", "").toLowerCase() === "operacao"
  || new URLSearchParams(location.search).get("modo") === "operacao";
window.addEventListener("hashchange", () => location.reload());

/* ===========================================================================
   APLICAÇÃO DAS MESAS (cliente)
   =========================================================================== */
function appCliente() {

  /* ============================================================================
     cliente.html — Interface do CLIENTE (mesas) do protótipo de rodízio
     ----------------------------------------------------------------------------
     Arquitetura:  vários cliente.html  <->  Firebase Realtime Database  <->  operacao.html

     ⚠ PROTÓTIPO: usa o Realtime Database sem autenticação (regras abertas).
       Essa configuração NÃO é adequada para produção.
     ============================================================================ */

  /* ============================================================================
     1) CONFIGURAÇÃO DO FIREBASE  —  COLE AQUI OS DADOS DO SEU PROJETO
     (Console do Firebase > Configurações do projeto > Seus apps > App da Web)
     O mesmo firebaseConfig deve ser usado no operacao.html.
     ============================================================================ */
  /* firebaseConfig: definido UMA vez no topo do arquivo */

  /* Nome exibido no topo (opcional) */
  const NOME_RESTAURANTE = "Rodízio";


  /* ============================================================================
     2) ESTRUTURA DE DADOS NO REALTIME DATABASE (contrato com o operacao.html)
     ----------------------------------------------------------------------------
     Tudo fica sob o nó raiz  /rodizio

     /rodizio/config
         versaoCatalogo    : number   versão do catálogo gravado
         fatiasPorPizza    : 8
         reposicaoMs       : 60000    tempo interno para repor uma pizza zerada
         totalMesas        : 15

     /rodizio/categorias/{categoriaId}          categoriaId: salgadas | doces | bebidas | diversos
         { id, nome, emoji, ordem, controlaEstoque:boolean, unidade:'fatia'|'unidade'|'porcao' }

     /rodizio/produtos/{produtoId}              72 produtos, IDs estáveis (ex.: "sal_calabresa_cebola")
         { id, nome, categoria, ordem, controlaEstoque:boolean, emoji }

     /rodizio/estoque/{produtoId}               SOMENTE pizzas (salgadas e doces)
         produtoId     : string
         capacidade    : 8               fatias por pizza
         disponivel    : number          fatias livres para NOVAS solicitações (nunca < 0)
         ciclo         : number          nº da pizza atual (incrementa a cada reposição)
         zeradoEm      : timestamp|null  quando chegou a 0 (base do cronômetro interno)
         repostoEm     : timestamp|null  quando a última pizza foi reposta
         atualizadoEm  : timestamp
         reservas/{solicitacaoId} : { mesaId, quantidade, ciclo, reservadoEm, prioridade? }
              fatias já destinadas a uma mesa (SOLICITADO / EM_ATENDIMENTO)
         fila/{solicitacaoId}     : { mesaId, quantidade, criadoEm }
              mesas aguardando a próxima pizza (AGUARDANDO_REPOSICAO).
              Soma da fila ≤ capacidade. Na reposição, a fila é atendida
              primeiro, em ordem de chegada (prioridade), e só depois as
              fatias restantes ficam em "disponivel".

         Toda alteração deste nó DEVE usar runTransaction() para evitar
         estoque negativo e reservas duplicadas.

     /rodizio/solicitacoes/{solicitacaoId}      solicitacaoId = chave push()
         id, mesaId ("mesa_07"), mesaNumero (7),
         produtoId, produtoNome, categoria, emoji,
         quantidade, unidade ('fatia'|'unidade'|'porcao'),
         controlaEstoque : boolean
         status          : SOLICITADO | EM_ATENDIMENTO | ATENDIDO | AGUARDANDO_REPOSICAO | CANCELADO
         prioridade      : boolean   true quando veio da fila após reposição
         cicloEstoque    : number|null
         origem          : 'cliente'
         sessaoId        : identificador aleatório do dispositivo
         criadoEm, atualizadoEm, atualizadoPor ('cliente'|'sistema'|'operacao')
         liberadoEm      : quando saiu da fila (prioridade)
         canceladoEm, canceladoPor ('cliente'|'operacao'), canceladoSessaoId
         historico/{chave}: { status, em, por }

     /rodizio/mesas/{mesaId}                    mesaId: mesa_01 … mesa_15
         numero, rotulo ("Mesa 07")
         inicioAtendimento : timestamp  pedidos anteriores a isto não aparecem em "Meus pedidos"
                                        (o operacao.html pode atualizar ao liberar a mesa)
         ultimaAtividadeEm : timestamp
         dispositivos/{sessaoId}: { conectadoEm, tipo:'cliente' }  (presença; removido ao desconectar)

     /rodizio/preferencias/{mesaId}/naoRecomendar/{produtoId} : true
         "Não recomendar" é individual por mesa.

     /rodizio/estatisticas/{produtoId}
         total, quantidadeTotal, ultimaSolicitacaoEm,
         janelaInicio, janelaContagem, popularAvisadoEm   (janela de 15 min p/ "bastante solicitada")

     /rodizio/atividade/{chave}                 feed público, sem dados de mesas
         { tipo:'popular'|'reposta'|'voltou', produtoId, produtoNome, categoria, emoji, texto, criadoEm }

     ----------------------------------------------------------------------------
     O QUE O operacao.html DEVE FAZER (para manter a mesma estrutura):
     • Ouvir /rodizio/solicitacoes (ex.: orderByChild('status')).
     • SOLICITADO -> EM_ATENDIMENTO -> ATENDIDO: atualizar status, atualizadoEm,
       atualizadoPor:'operacao' e acrescentar em historico.
     • Ao marcar ATENDIDO: remover /estoque/{produtoId}/reservas/{id}
       (as fatias foram entregues; "disponivel" NÃO muda). O cliente também

  const coberturaCache = {};

      case "morango": return `<g ${t}><path d="M0 -5 C 5.5 -5 6.2 1.5 0 7.5 C -6.2 1.5 -5.5 -5 0 -5 Z" fill="${cor}"/><path d="M-3 -5 L0 -7.4 L3 -5" stroke="#3C8A3F" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>`;

  function coberturaPizza(p) {
