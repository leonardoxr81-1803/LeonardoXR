  }
  function svgBebida(p) {
    const v = p.visual;
    let s = `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(p.nome)}"><circle class="prato" cx="100" cy="100" r="98"/><ellipse cx="100" cy="168" rx="40" ry="6" fill="#000" fill-opacity=".08"/>`;
    if (v.t === "lata") {
      s += `<rect x="68" y="44" width="64" height="122" rx="12" fill="${v.cor}"/>
        <rect x="68" y="94" width="64" height="26" fill="${v.faixa}" fill-opacity=".92"/>
        <rect x="78" y="54" width="7" height="104" rx="3.5" fill="#fff" fill-opacity=".22"/>
        <ellipse cx="100" cy="46" rx="30" ry="6" fill="#D6DADF"/><ellipse cx="100" cy="46" rx="20" ry="3.4" fill="#AEB4BA"/>`;
    } else if (v.t === "copo") {
      s += `<path d="M64 48 H136 L127 164 Q100 170 73 164 Z" fill="#fff" fill-opacity=".75" stroke="#B8C2BC" stroke-width="2"/>
        <path d="M67 80 H133 L126.8 162 Q100 167 73.2 162 Z" fill="${v.cor}"/>
        <rect x="80" y="86" width="17" height="15" rx="3" fill="#fff" fill-opacity=".45" transform="rotate(-12 88 93)"/>
        <rect x="102" y="96" width="15" height="14" rx="3" fill="#fff" fill-opacity=".35" transform="rotate(10 110 103)"/>
        <line x1="114" y1="28" x2="104" y2="150" stroke="#E0452B" stroke-width="5.5" stroke-linecap="round"/>`;
    } else if (v.t === "garrafa") {
      s += `<rect x="89" y="28" width="22" height="12" rx="3" fill="#2F6FB0"/>
        <path d="M90 40 H110 V54 Q128 64 128 86 V158 Q128 168 118 168 H82 Q72 168 72 158 V86 Q72 64 90 54 Z" fill="${v.cor}" fill-opacity=".8" stroke="#6FA9CC" stroke-width="1.5"/>
        <rect x="72" y="104" width="56" height="30" fill="#fff" fill-opacity=".85"/><rect x="72" y="115" width="56" height="7" fill="#2F6FB0" fill-opacity=".5"/>
        <rect x="80" y="72" width="6" height="80" rx="3" fill="#fff" fill-opacity=".35"/>`;
      if (v.gas) s += `<circle cx="100" cy="146" r="3" fill="#fff" fill-opacity=".8"/><circle cx="110" cy="152" r="2.2" fill="#fff" fill-opacity=".8"/><circle cx="92" cy="90" r="2.4" fill="#fff" fill-opacity=".8"/><circle cx="112" cy="84" r="3" fill="#fff" fill-opacity=".8"/>`;
    } else {
      s += `<path d="M74 40 H126 L119 166 H81 Z" fill="#fff" fill-opacity=".75" stroke="#B8C2BC" stroke-width="2"/>
        <path d="M77 70 H123 L119.8 118 H80.2 Z" fill="${v.cor2}"/><path d="M80.2 118 H119.8 L119 164 H81 Z" fill="${v.cor}"/>
        <circle cx="120" cy="44" r="12" fill="#F4DA6B" stroke="#fff" stroke-width="2"/>
        <line x1="108" y1="24" x2="98" y2="150" stroke="#1F3B2D" stroke-width="5" stroke-linecap="round"/>`;
    }
    return s + `</svg>`;
  }
  function svgPrato(p) {
    return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(p.nome)}"><circle class="prato" cx="100" cy="100" r="98"/><circle cx="100" cy="100" r="74" fill="#fff" stroke="#DCE2D9" stroke-width="3"/><text x="100" y="104" text-anchor="middle" dominant-baseline="middle" font-size="76">${p.emoji}</text></svg>`;
  }
  function imagemProduto(p, st) {
    if (p.categoria === "bebidas") return svgBebida(p);
    if (p.categoria === "diversos") return svgPrato(p);
    const cap = st?.capacidade || FATIAS_POR_PIZZA;
    const disp = st?.tipo === "disponivel" ? st.disponivel : st?.tipo === "indisponivel" ? 0 : cap;
    return svgPizza(p, disp, cap);
  }

  /* ============================================================================
     7) REGRAS DE DISPONIBILIDADE (leitura do estado compartilhado)
     ============================================================================ */
  function estadoProduto(p) {
    if (!p.controlaEstoque) return { tipo: "livre" };
    const e = S.estoque[p.id];
    if (!e) return { tipo: "carregando", capacidade: FATIAS_POR_PIZZA };
    const cap = Number(e.capacidade) || FATIAS_POR_PIZZA;
    const disp = Math.max(0, Math.min(cap, Number(e.disponivel) || 0));
    const livreProxima = Math.max(0, cap - somaFila(e.fila));
    const recem = disp > 0 && (e.ciclo || 1) > 1 && e.repostoEm && agoraServidor() - e.repostoEm < DESTAQUE_REPOSTA_MS;
    return { tipo: disp > 0 ? "disponivel" : "indisponivel", disponivel: disp, capacidade: cap, livreProxima, recem };
  }

  /* ============================================================================
     8) OPERAÇÕES NO BANCO (todas as que mexem em estoque usam transação)
     ============================================================================ */

  /* Distribui fatias livres para a fila (ordem de chegada). Usada DENTRO de transações. */
  function alocarFila(cur, livres, promovidos) {
    const fila = cur.fila || {};
    const ordem = Object.entries(fila).sort((a, b) => (a[1]?.criadoEm || 0) - (b[1]?.criadoEm || 0));
    for (const [id, f] of ordem) {
      if (livres <= 0) break;
      const q = Number(f?.quantidade) || 0;
      if (q > 0 && q <= livres) {
        cur.reservas = cur.reservas || {};
        cur.reservas[id] = { mesaId: f.mesaId, quantidade: q, ciclo: cur.ciclo, reservadoEm: agoraServidor(), prioridade: true };
        delete fila[id];
        livres -= q;
        promovidos.push(id);
      }
    }
    cur.fila = fila;
    return livres;
  }

  /* Cria uma solicitação de PIZZA reservando fatias com transação.
     modo "agora"   -> reserva do estoque atual (nunca além do disponível)
     modo "proxima" -> entra na fila da próxima pizza (soma da fila ≤ capacidade) */
  async function solicitarPizza(p, qtd, modo) {
    qtd = Math.floor(Number(qtd));
    if (!Number.isInteger(qtd) || qtd < 1 || qtd > FATIAS_POR_PIZZA) return { ok: false, motivo: "invalida" };
    const st = estadoProduto(p);
    if (modo === "agora" && st.tipo === "disponivel" && qtd > st.disponivel) return { ok: false, motivo: "insuficiente", restante: st.disponivel };

    const solRef = push(r("solicitacoes"));
    const solId = solRef.key;
    const mesaId = S.mesaId;
    let motivo = null, restante = null;

    const tx = await runTransaction(r(`estoque/${p.id}`), (cur) => {
      motivo = null; restante = null;
      if (cur === null) return cur; // cache local vazio: o Firebase repete com o valor real
      const cap = Number(cur.capacidade) || FATIAS_POR_PIZZA;
      const disp = Math.max(0, Number(cur.disponivel) || 0);
      const agora = agoraServidor();
      if (modo === "agora") {
        if (disp <= 0) { motivo = "esgotado"; return; }
        if (qtd > disp) { motivo = "insuficiente"; restante = disp; return; }
        cur.disponivel = disp - qtd;
        cur.reservas = cur.reservas || {};
        cur.reservas[solId] = { mesaId, quantidade: qtd, ciclo: cur.ciclo || 1, reservadoEm: agora };
        if (cur.disponivel === 0) cur.zeradoEm = agora;
      } else {
        if (disp > 0) { motivo = "voltou"; return; }
        const livre = cap - somaFila(cur.fila);
        if (livre <= 0) { motivo = "fila_cheia"; return; }
        if (qtd > livre) { motivo = "fila_insuficiente"; restante = livre; return; }
        cur.fila = cur.fila || {};
        cur.fila[solId] = { mesaId, quantidade: qtd, criadoEm: agora };
        if (!cur.zeradoEm) cur.zeradoEm = agora;
      }
      cur.atualizadoEm = agora;
      return cur;
    }, { applyLocally: false });

    if (!tx.committed) return { ok: false, motivo: motivo || "erro", restante };
    const val = tx.snapshot.val() || {};
    let status;
    if (val.reservas && val.reservas[solId]) status = STATUS.SOLICITADO;
    else if (val.fila && val.fila[solId]) status = STATUS.AGUARDANDO_REPOSICAO;
    else return { ok: false, motivo: "erro" };

    await gravarSolicitacao(solRef, p, qtd, status, val.reservas?.[solId]?.ciclo ?? null);
    posPedido(p, qtd);
    return { ok: true, status };
  }

  /* Bebidas e diversos: sempre disponíveis, sem controle de estoque. */
  async function solicitarLivre(p, qtd) {
    qtd = Math.floor(Number(qtd));
    const max = CAT[p.categoria].maxQtd;
    if (!Number.isInteger(qtd) || qtd < 1 || qtd > max) return { ok: false, motivo: "invalida" };
    const solRef = push(r("solicitacoes"));
    await gravarSolicitacao(solRef, p, qtd, STATUS.SOLICITADO, null);
    posPedido(p, qtd);
    return { ok: true, status: STATUS.SOLICITADO };
  }

  function gravarSolicitacao(solRef, p, qtd, status, ciclo) {
    const ts = serverTimestamp();
    return set(solRef, {
      id: solRef.key,
      mesaId: S.mesaId,
      mesaNumero: S.mesaNumero,
      produtoId: p.id,
      produtoNome: p.nome,
      categoria: p.categoria,
      emoji: p.emoji,
      quantidade: qtd,
      unidade: unidadeDe(p).id,
      controlaEstoque: !!p.controlaEstoque,
      status,
      prioridade: false,
      cicloEstoque: ciclo,
      origem: "cliente",
      sessaoId: S.sessaoId,
      criadoEm: ts,
      atualizadoEm: ts,
      atualizadoPor: "cliente",
      historico: { [novaChave()]: { status, em: ts, por: "cliente" } }
    });
  }

  function posPedido(p, qtd) {
    update(r(`mesas/${S.mesaId}`), { ultimaAtividadeEm: serverTimestamp() }).catch(() => {});
    registrarEstatistica(p, qtd).catch(() => {});
  }

  async function registrarEstatistica(p, qtd) {
    let virouPopular = false;
    await runTransaction(r(`estatisticas/${p.id}`), (cur) => {
      virouPopular = false;
      const agora = agoraServidor();
      const c = cur || {};
      if (!c.janelaInicio || agora - c.janelaInicio > JANELA_POPULAR_MS) {
        c.janelaInicio = agora; c.janelaContagem = 0; c.popularAvisadoEm = null;
      }
      c.total = (c.total || 0) + 1;
      c.quantidadeTotal = (c.quantidadeTotal || 0) + qtd;
      c.janelaContagem = (c.janelaContagem || 0) + 1;
      c.ultimaSolicitacaoEm = agora;
      if (c.janelaContagem >= LIMIAR_POPULAR && !c.popularAvisadoEm) { c.popularAvisadoEm = agora; virouPopular = true; }
      return c;
    }, { applyLocally: false });
    if (virouPopular) registrarAtividade("popular", PRODUTO[p.id]);
  }

  /* Feed público: nunca inclui mesa, sessão ou quantidade. */
  function registrarAtividade(tipo, p) {
    if (!p) return;
    let emoji = CAT[p.categoria].emoji, texto;
    const pizza = p.controlaEstoque;
    if (tipo === "popular") texto = pizza ? `${p.nome} está sendo bastante solicitada.` : `Muitas mesas estão pedindo ${p.nome}.`;
    else if (tipo === "reposta") {
      if (p.categoria === "salgadas") { emoji = "🔥"; texto = `${p.nome} acabou de sair.`; }
      else { emoji = "🍫"; texto = `${p.nome} voltou a ficar disponível.`; }
    } else if (tipo === "voltou") texto = `${p.nome} voltou a ficar disponível.`;
    else return;
    Promise.resolve(push(r("atividade"), { tipo, produtoId: p.id, produtoNome: p.nome, categoria: p.categoria, emoji, texto, criadoEm: serverTimestamp() })).catch(() => {});
  }

  /* Cancelamento pelo cliente: só enquanto SOLICITADO (ou aguardando na fila).
     A transação no status impede cancelar algo que a equipe já colocou EM ATENDIMENTO. */
  async function cancelarSolicitacao(solId) {
    const sol = S.minhas[solId];
    if (!sol) return;
    if (!S.conectado) { toast("Sem conexão no momento. Tente novamente em instantes."); return; }
    const tx = await runTransaction(r(`solicitacoes/${solId}`), (cur) => {
      if (cur === null) return cur;
      if (!CANCELAVEIS.includes(cur.status)) return;
      const agora = agoraServidor();
      cur.status = STATUS.CANCELADO;
      cur.canceladoPor = "cliente";
      cur.canceladoSessaoId = S.sessaoId;
      cur.canceladoEm = agora;
      cur.atualizadoEm = agora;
      cur.atualizadoPor = "cliente";
      cur.historico = cur.historico || {};
      cur.historico[novaChave()] = { status: STATUS.CANCELADO, em: agora, por: "cliente" };
      return cur;
    }, { applyLocally: false });

    if (!tx.committed || tx.snapshot.val()?.status !== STATUS.CANCELADO) {
      toast("Esse pedido já está em atendimento e não pode mais ser cancelado.");
      return;
    }
    if (sol.controlaEstoque) await liberarEstoque(sol.produtoId, solId);
    toast(`Pedido de ${sol.produtoNome} cancelado. O garçom já foi avisado.`);
  }

  /* Devolve fatias de uma solicitação cancelada (idempotente).
     - Se estava na fila: só sai da fila.
     - Se tinha reserva do MESMO ciclo: as fatias voltam — primeiro para a fila
       (prioridade), depois para "disponivel". */
  async function liberarEstoque(produtoId, solId) {
    let promovidos = [], voltou = false;
    const tx = await runTransaction(r(`estoque/${produtoId}`), (cur) => {
      promovidos = []; voltou = false;
      if (cur === null) return cur;
      const agora = agoraServidor();
      if (cur.fila && cur.fila[solId]) { delete cur.fila[solId]; cur.atualizadoEm = agora; return cur; }
      const res = cur.reservas && cur.reservas[solId];
      if (!res) return; // nada a liberar
      delete cur.reservas[solId];
      const cap = Number(cur.capacidade) || FATIAS_POR_PIZZA;
      if ((res.ciclo || 1) === (cur.ciclo || 1)) {
        const antes = Math.max(0, Number(cur.disponivel) || 0);
        let livres = Math.min(cap, antes + (Number(res.quantidade) || 0)) - antes;
        livres = alocarFila(cur, livres, promovidos);
        cur.disponivel = antes + livres;
        if (cur.disponivel > 0) { cur.zeradoEm = null; if (antes === 0) voltou = true; }
      }
      cur.atualizadoEm = agora;
      return cur;
    }, { applyLocally: false });
    if (tx.committed) {
      promovidos.forEach(id => promoverSolicitacao(id));
      if (voltou) registrarAtividade("voltou", PRODUTO[produtoId]);
    }
  }

  /* Remove a reserva de um pedido já ATENDIDO (as fatias foram entregues). Idempotente. */
  async function consumirReserva(produtoId, solId) {
    await runTransaction(r(`estoque/${produtoId}`), (cur) => {
      if (cur === null) return cur;
      if (!cur.reservas || !cur.reservas[solId]) return;
      delete cur.reservas[solId];
      return cur;
    }, { applyLocally: false });
  }

  /* Reposição interna: pizza zerada há ≥ 1 minuto volta a 8 fatias.
     Qualquer dispositivo conectado pode executar; a transação garante que
     apenas UM repõe. A fila (pedidos pendentes) é atendida antes de tudo. */
  async function reporPizza(produtoId) {
    if (!db || !S.conectado || S.emAndamento.has("repor:" + produtoId)) return;
    S.emAndamento.add("repor:" + produtoId);
    let promovidos = [], repos = false;
    try {
      const tx = await runTransaction(r(`estoque/${produtoId}`), (cur) => {
        promovidos = []; repos = false;
        if (cur === null) return cur;
        if ((Number(cur.disponivel) || 0) > 0) return;
        const agora = agoraServidor();
        if (!cur.zeradoEm) { cur.zeradoEm = agora; return cur; } // corrige dado sem marca de tempo
        if (agora - cur.zeradoEm < REPOSICAO_MS) return;
        const cap = Number(cur.capacidade) || FATIAS_POR_PIZZA;
        cur.ciclo = (cur.ciclo || 1) + 1;
        const livres = alocarFila(cur, cap, promovidos);
        cur.disponivel = livres;
        cur.repostoEm = agora;
        cur.zeradoEm = livres === 0 ? agora : null;
        cur.atualizadoEm = agora;
        repos = true;
        return cur;
      }, { applyLocally: false });
      if (tx.committed && repos) {
        promovidos.forEach(id => promoverSolicitacao(id));
        registrarAtividade("reposta", PRODUTO[produtoId]);
      }
    } catch (e) {
      console.warn("[reposição]", e);
    } finally {
      S.emAndamento.delete("repor:" + produtoId);
    }
  }

  /* AGUARDANDO_REPOSICAO -> SOLICITADO com prioridade (só se ainda estiver aguardando). */
  async function promoverSolicitacao(solId) {
    const chave = "promover:" + solId;
    if (S.emAndamento.has(chave)) return;
    S.emAndamento.add(chave);
    try {
      await runTransaction(r(`solicitacoes/${solId}`), (cur) => {
        if (cur === null) return cur;
        if (cur.status !== STATUS.AGUARDANDO_REPOSICAO) return;
        const agora = agoraServidor();
        cur.status = STATUS.SOLICITADO;
        cur.prioridade = true;
        cur.liberadoEm = agora;
        cur.atualizadoEm = agora;
        cur.atualizadoPor = "sistema";
        cur.historico = cur.historico || {};
        cur.historico[novaChave()] = { status: STATUS.SOLICITADO, em: agora, por: "sistema" };
        return cur;
      }, { applyLocally: false });
    } catch (e) { console.warn("[promover]", e); }
    finally { S.emAndamento.delete(chave); }
  }

  /* Mantém solicitações desta mesa coerentes com o estoque, caso algum
     dispositivo tenha perdido a conexão no meio de uma operação. */
  function reconciliar() {
    if (!S.conectado || !S.estoqueCarregado) return;
    for (const s of Object.values(S.minhas)) {
      if (!s || !s.controlaEstoque) continue;
      const e = S.estoque[s.produtoId];
      if (!e) continue;
      const temReserva = !!(e.reservas && e.reservas[s.id]);
      const naFila = !!(e.fila && e.fila[s.id]);
      if (s.status === STATUS.AGUARDANDO_REPOSICAO && temReserva) promoverSolicitacao(s.id);
      else if (s.status === STATUS.CANCELADO && (temReserva || naFila)) umaVez("lib:" + s.id, () => liberarEstoque(s.produtoId, s.id));
      else if (s.status === STATUS.ATENDIDO && temReserva) umaVez("cons:" + s.id, () => consumirReserva(s.produtoId, s.id));
    }
  }
  function umaVez(chave, fn) {
    if (S.emAndamento.has(chave)) return;
    S.emAndamento.add(chave);
    Promise.resolve().then(fn).catch(e => console.warn(e)).finally(() => S.emAndamento.delete(chave));
  }

  /* Agenda a reposição (timer interno, invisível para o cliente). */
  function agendarReposicoes() {
    for (const p of PIZZAS) {
      clearTimeout(S.timersReposicao[p.id]);
      const e = S.estoque[p.id];
      if (!e || (Number(e.disponivel) || 0) > 0) continue;
      const falta = e.zeradoEm ? e.zeradoEm + REPOSICAO_MS - agoraServidor() : 0;
      S.timersReposicao[p.id] = setTimeout(() => reporPizza(p.id), Math.max(0, falta) + 250);
    }
  }

  /* Cria catálogo e estoque inicial no banco se ainda não existirem. Seguro com vários dispositivos. */
  let catalogoOk = false;
  async function garantirCatalogo() {
    if (catalogoOk || !S.conectado) return;
    catalogoOk = true;
    try {
      const cfg = await get(r("config/versaoCatalogo"));
      if (cfg.val() !== VERSAO_CATALOGO) {
        const u = {};
        u["config/versaoCatalogo"] = VERSAO_CATALOGO;
        u["config/fatiasPorPizza"] = FATIAS_POR_PIZZA;
        u["config/reposicaoMs"] = REPOSICAO_MS;
        u["config/totalMesas"] = TOTAL_MESAS;
        for (const c of CATEGORIAS) u[`categorias/${c.id}`] = { id: c.id, nome: c.nome, emoji: c.emoji, ordem: c.ordem, controlaEstoque: c.controlaEstoque, unidade: c.unidade.id };
        for (const p of PRODUTOS) u[`produtos/${p.id}`] = { id: p.id, nome: p.nome, categoria: p.categoria, ordem: p.ordem, controlaEstoque: p.controlaEstoque, emoji: p.emoji };
        for (let n = 1; n <= TOTAL_MESAS; n++) { u[`mesas/${mesaIdDe(n)}/numero`] = n; u[`mesas/${mesaIdDe(n)}/rotulo`] = `Mesa ${doisDig(n)}`; }
        await update(ref(db, RAIZ), u);
      }
      const est = await get(r("estoque"));
      const atual = est.val() || {};
      await Promise.all(PIZZAS.filter(p => !atual[p.id]).map(p =>
        runTransaction(r(`estoque/${p.id}`), (cur) => cur === null ? {
          produtoId: p.id, capacidade: FATIAS_POR_PIZZA, disponivel: FATIAS_POR_PIZZA, ciclo: 1, atualizadoEm: agoraServidor()
        } : undefined, { applyLocally: false })
      ));
    } catch (e) {
      catalogoOk = false;
      console.warn("[catálogo]", e);
    }
  }

  /* ============================================================================
     9) LISTENERS EM TEMPO REAL
     ============================================================================ */
  function ouvirGlobais() {
    onValue(ref(db, ".info/serverTimeOffset"), s => { S.offset = Number(s.val()) || 0; });
    onValue(ref(db, ".info/connected"), s => {
      S.conectado = s.val() === true;
      if (S.conectado) { S.jaConectou = true; garantirCatalogo(); registrarPresenca(); reconciliar(); agendarReposicoes(); }
      atualizarConexao();
      agendarRender();
    });
    onValue(r("estoque"), s => {
      S.estoque = s.val() || {};
      S.estoqueCarregado = true;
      agendarReposicoes();
      reconciliar();
      agendarRender();
    }, erroSilencioso);
    onValue(r("estatisticas"), s => { S.estatisticas = s.val() || {}; agendarRender(); }, erroSilencioso);
    onValue(query(r("atividade"), orderByChild("criadoEm"), limitToLast(30)), s => {
      const lista = [];
      s.forEach(c => { lista.push({ id: c.key, ...c.val() }); });
      S.atividade = lista.reverse();
      if (!ls.get("rodizio.atividadeVista")) ls.set("rodizio.atividadeVista", String(agoraServidor()));
      renderAtividade();
    }, erroSilencioso);
  }

  function ouvirMesa() {
    S.unsubMesa.forEach(u => u());
    S.unsubMesa = [];
    S.minhas = {}; S.minhasCarregadas = false; S.statusAnterior = {}; S.prefs = {}; S.mesaInfo = {};
    const mesaId = S.mesaId;

    S.unsubMesa.push(onValue(r(`mesas/${mesaId}`), s => { S.mesaInfo = s.val() || {}; agendarRender(); }, erroSilencioso));
    S.unsubMesa.push(onValue(r(`preferencias/${mesaId}/naoRecomendar`), s => { S.prefs = s.val() || {}; agendarRender(); }, erroSilencioso));
    S.unsubMesa.push(onValue(query(r("solicitacoes"), orderByChild("mesaId"), equalTo(mesaId)), s => {
      const novas = {};
      s.forEach(c => { const v = c.val(); if (v) novas[c.key] = { ...v, id: c.key }; });
      detectarMudancas(novas);
      S.minhas = novas;
      reconciliar();
      agendarRender();
    }, erroSilencioso));
  }

  function erroSilencioso(e) { console.warn("[firebase]", e); }

  async function registrarPresenca() {
    if (!db || !S.mesaId || !S.conectado) return;
    try {
      const pRef = r(`mesas/${S.mesaId}/dispositivos/${S.sessaoId}`);
      await onDisconnect(pRef).remove();
      await set(pRef, { conectadoEm: serverTimestamp(), tipo: "cliente" });
      await runTransaction(r(`mesas/${S.mesaId}/inicioAtendimento`), cur => cur ? undefined : agoraServidor(), { applyLocally: false });
    } catch (e) { console.warn("[presença]", e); }
  }
  function sairDaMesa(mesaIdAntiga) {
    if (!db || !mesaIdAntiga) return;
    const pRef = r(`mesas/${mesaIdAntiga}/dispositivos/${S.sessaoId}`);
    onDisconnect(pRef).cancel().catch(() => {});
    remove(pRef).catch(() => {});
  }

  /* Avisos quando a equipe (ou o sistema) muda o status de um pedido desta mesa */
  function detectarMudancas(novas) {
    if (!S.minhasCarregadas) {
      S.minhasCarregadas = true;
      S.statusAnterior = Object.fromEntries(Object.entries(novas).map(([k, v]) => [k, v.status]));
      return;
    }
    for (const [id, s] of Object.entries(novas)) {
      const antes = S.statusAnterior[id];
      if (antes && antes !== s.status) notificarMudanca(s, antes);
    }
    S.statusAnterior = Object.fromEntries(Object.entries(novas).map(([k, v]) => [k, v.status]));
  }
  function notificarMudanca(s, antes) {
    const p = PRODUTO[s.produtoId];
    const nome = s.produtoNome || p?.nome || "seu pedido";
    if (antes === STATUS.AGUARDANDO_REPOSICAO && s.status === STATUS.SOLICITADO) {
      mostrarConfirmacao({
        fogo: true, icone: "🔥",
        titulo: `Sua ${nome} acabou de sair.`,
        texto: `<b>${esc(p ? qtdTexto(s.quantidade, p) : s.quantidade)}</b> destinadas à sua mesa.`
      });
      vibrar([60, 40, 60]);
    } else if (s.status === STATUS.EM_ATENDIMENTO) {
      toast(`🛎️ O garçom já está cuidando do seu pedido de ${nome}.`); vibrar(40);
    } else if (s.status === STATUS.ATENDIDO) {
      toast(`✓ ${nome} entregue na sua mesa. Bom apetite!`);
    } else if (s.status === STATUS.CANCELADO) {
      if (s.canceladoSessaoId === S.sessaoId) return;
      toast(s.canceladoPor === "cliente" ? `Pedido de ${nome} cancelado.` : `O pedido de ${nome} foi cancelado pela equipe.`);
    }
  }
  function vibrar(p) { try { navigator.vibrate?.(p); } catch {} }

  /* ============================================================================
     10) INTERFACE — renderização
     ============================================================================ */
  let renderPendente = false;
  function agendarRender() {
    if (renderPendente) return;
    renderPendente = true;
    requestAnimationFrame(() => {
      renderPendente = false;
      atualizarCards();
      renderRecs();
      renderBarraPedidos();
      if (S.sheet && !$("#telaQtd").hidden) renderSheet();
      if (!$("#telaPedidos").hidden) renderPedidos();
    });
  }

  function atualizarConexao() {
    const el = $("#conexao");
    if (S.conectado) { el.dataset.estado = "on"; el.lastElementChild.textContent = "Conectado"; }
    else { el.dataset.estado = "off"; el.lastElementChild.textContent = S.jaConectou ? "Reconectando..." : "Conectando..."; }
  }

  /* ---- Abas ---- */
  function montarAbas() {
    $("#abas").innerHTML = CATEGORIAS.map(c =>
      `<button class="aba" role="tab" type="button" data-cat="${c.id}" aria-selected="${c.id === S.categoria}"><span class="aba-emoji" aria-hidden="true">${c.emoji}</span><span>${c.nome}</span></button>`
    ).join("");
  }
  function trocarCategoria(cat) {
    if (!CAT[cat]) return;
    S.categoria = cat;
    document.querySelectorAll(".aba").forEach(b => b.setAttribute("aria-selected", String(b.dataset.cat === cat)));
    renderCardapio();
  }

  /* ---- Cardápio: 3 páginas de 3×2 ---- */
  function htmlCard(p) {
    const st = estadoProduto(p);
    const oculto = !!S.prefs[p.id];
    let disp, botao, selo = "";
    if (st.tipo === "livre") {
      disp = `<p class="card-disp ok">Disponível</p>`;
      botao = `<button class="btn-pedir" type="button" data-acao="pedir">PEDIR</button>`;
    } else if (st.tipo === "carregando") {
      disp = `<p class="card-disp">Carregando…</p>`;
      botao = `<button class="btn-pedir" type="button" disabled>PEDIR</button>`;
    } else if (st.tipo === "disponivel") {
      disp = `<p class="card-disp ok"><b>${st.disponivel}</b> ${st.disponivel === 1 ? "fatia disponível" : "fatias disponíveis"}</p>`;
      botao = `<button class="btn-pedir" type="button" data-acao="pedir">PEDIR</button>`;
      if (st.recem) selo = `<span class="selo">🔥 ${p.categoria === "doces" ? "REPOSTA AGORA" : "ACABOU DE SAIR"}</span>`;
    } else {
      disp = `<p class="card-disp esg">TEMPORARIAMENTE INDISPONÍVEL</p>`;
      botao = st.livreProxima > 0
        ? `<button class="btn-pedir sec" type="button" data-acao="proxima">QUERO DA PRÓXIMA</button>`
        : `<button class="btn-pedir" type="button" disabled>INDISPONÍVEL</button>`;
    }
    const naoRec = `<button class="btn-naorec${oculto ? " on" : ""}" type="button" data-acao="naorec" aria-pressed="${oculto}">${oculto ? "↺ Voltar a recomendar" : "🚫 Não recomendar"}</button>`;
    return {
      classe: "card" + (st.tipo === "indisponivel" ? " esgotado" : ""),
      html: `<div class="card-img">${imagemProduto(p, st)}${selo}</div><h3 class="card-nome">${esc(p.nome)}</h3>${disp}${botao}${naoRec}`
    };
  }
  function renderCardapio() {
    const prods = PRODUTOS.filter(p => p.categoria === S.categoria);
    const pags = [0, 1, 2].map(i => prods.slice(i * 6, i * 6 + 6));
    const pager = $("#pager");
    pager.innerHTML = pags.map((pg, i) =>
      `<div class="pagina" role="group" aria-label="Página ${i + 1} de 3">${pg.map(p => {
        const c = htmlCard(p);
        return `<article class="${c.classe}" data-id="${p.id}">${c.html}</article>`;
      }).join("")}</div>`
    ).join("");
    $("#dots").innerHTML = pags.map((_, i) => `<button class="dot" type="button" data-pag="${i}" aria-label="Página ${i + 1}"></button>`).join("");
    requestAnimationFrame(() => { pager.scrollLeft = S.paginas[S.categoria] * pager.clientWidth; marcarPagina(S.paginas[S.categoria]); });
    marcarPagina(S.paginas[S.categoria]);
  }
  function atualizarCards() {
    document.querySelectorAll("#pager .card").forEach(el => {
      const p = PRODUTO[el.dataset.id];
      if (!p) return;
      const c = htmlCard(p);
      if (el._html !== c.html) { el.innerHTML = c.html; el._html = c.html; }
      if (el.className !== c.classe) el.className = c.classe;
    });
  }
  function paginaAtual() { const pg = $("#pager"); return pg.clientWidth ? Math.round(pg.scrollLeft / pg.clientWidth) : 0; }
  function irPagina(i) {
    const pg = $("#pager");
    i = Math.max(0, Math.min(2, i));
    const reduz = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    pg.scrollTo({ left: i * pg.clientWidth, behavior: reduz ? "auto" : "smooth" });
    marcarPagina(i);
  }
  function marcarPagina(i) {
    S.paginas[S.categoria] = i;
    document.querySelectorAll("#dots .dot").forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
    $("#pgAnt").disabled = i <= 0;
    $("#pgProx").disabled = i >= 2;
    $("#paginaRotulo").textContent = `Página ${i + 1} de 3 · arraste para o lado para ver mais`;
  }

  /* ---- Recomendações: ✨ Para sua mesa ---- */
  function calcularRecomendacoes() {
    const hist = {};
    for (const s of pedidosVisiveis()) if (s.status !== STATUS.CANCELADO) hist[s.produtoId] = (hist[s.produtoId] || 0) + 1;
    const agora = agoraServidor();
    const lista = [];
    for (const p of PRODUTOS) {
      if (S.prefs[p.id]) continue;
      const st = estadoProduto(p);
      if (st.tipo !== "livre" && st.tipo !== "disponivel") continue;
      const est = S.estatisticas[p.id] || {};
      const janela = est.janelaInicio && agora - est.janelaInicio <= JANELA_POPULAR_MS ? (est.janelaContagem || 0) : 0;
      const motivos = [];
      if (st.recem) motivos.push([6, p.categoria === "doces" ? "🔥 Reposta agora" : "🔥 Acabou de sair"]);
      if (hist[p.id]) motivos.push([2.5 * Math.min(hist[p.id], 3), "Sua mesa já pediu"]);
      if (janela) motivos.push([1.3 * Math.min(janela, 6), "Em alta agora"]);
      if (est.total) motivos.push([0.12 * Math.min(est.total, 25), "Popular no salão"]);
      if (SUGESTOES_DA_CASA.includes(p.id)) motivos.push([0.9, "Sugestão da casa"]);
      if (!motivos.length) continue;
      const score = motivos.reduce((t, m) => t + m[0], 0);
      const principal = motivos.slice().sort((a, b) => b[0] - a[0])[0][1];
      lista.push({ p, score, motivo: principal });
    }
    lista.sort((a, b) => b.score - a.score || SUGESTOES_DA_CASA.indexOf(a.p.id) - SUGESTOES_DA_CASA.indexOf(b.p.id));
    const porCat = {}, final = [];
    for (const it of lista) {
      if (final.length >= 4) break;
      if ((porCat[it.p.categoria] || 0) >= 2) continue;
      porCat[it.p.categoria] = (porCat[it.p.categoria] || 0) + 1;
      final.push(it);
    }
    return final;
  }
  function renderRecs() {
    const recs = calcularRecomendacoes();
    const html = recs.length
      ? recs.map(({ p, motivo }) => {
          const st = estadoProduto(p);
          return `<div class="rec"><div class="rec-img">${imagemProduto(p, st)}</div><div class="rec-txt"><span class="rec-nome">${esc(p.nome)}</span><span class="rec-motivo">${esc(motivo)}</span></div><button class="rec-pedir" type="button" data-rec="${p.id}" aria-label="Pedir ${esc(p.nome)}">PEDIR</button></div>`;
        }).join("")
      : `<p class="recs-vazio">Explore o cardápio abaixo e escolha o que sua mesa quer receber.</p>`;
    const lista = $("#recsLista");
    if (lista._html !== html) { lista.innerHTML = html; lista._html = html; }
    const ocultos = Object.keys(S.prefs).filter(id => PRODUTO[id]).length;
    const btn = $("#btnRestaurar");
    btn.hidden = ocultos === 0;
    btn.textContent = ocultos === 1 ? "Mostrar 1 item oculto" : `Mostrar ${ocultos} itens ocultos`;
  }

  /* ---- Folha de quantidade ---- */
  function abrirSheet(produtoId, modo = "agora") {
    const p = PRODUTO[produtoId];
    if (!p) return;
    if (!S.mesaId) { abrirTelaMesa(); return; }
    S.sheet = { produtoId, modo: p.controlaEstoque ? modo : "livre", qtd: 1, aviso: "", avisoBom: false, enviando: false };
    const cat = CAT[p.categoria];
    $("#qtdCat").textContent = `${cat.emoji} ${cat.nome}`;
    $("#qtdNome").textContent = p.nome;
    abrir("telaQtd");
    renderSheet();
    setTimeout(() => $("#qtdConfirmar").focus(), 60);
  }
  function renderSheet() {
    const sh = S.sheet;
    if (!sh) return;
    const p = PRODUTO[sh.produtoId];
    const cat = CAT[p.categoria];
    const st = estadoProduto(p);
    const btn = $("#qtdConfirmar");

    $("#qtdImg").innerHTML = imagemProduto(p, st);
    if (sh.enviando) { btn.disabled = true; btn.textContent = "ENVIANDO…"; return; }

    let max, info, pergunta, totalChips;
    if (!p.controlaEstoque) {
      max = cat.maxQtd; totalChips = cat.maxQtd;
      info = "Sempre disponível.";
      pergunta = `Quantas ${cat.unidade.p} sua mesa quer?`;
    } else {
      totalChips = FATIAS_POR_PIZZA;
      pergunta = "Quantas fatias sua mesa quer?";
      if (st.tipo === "carregando") { max = 0; info = "Carregando…"; }
      else if (sh.modo === "agora" && st.tipo === "indisponivel") {
        sh.modo = "proxima";
        if (!sh.aviso) { sh.aviso = "Essa fatia acabou de ser solicitada por outra mesa."; sh.avisoBom = false; }
        return renderSheet();
      } else if (sh.modo === "proxima" && st.tipo === "disponivel") {
        sh.modo = "agora"; sh.aviso = "Boa notícia: essa pizza voltou a ficar disponível."; sh.avisoBom = true;
        return renderSheet();
      } else if (sh.modo === "agora") {
        max = st.disponivel;
        info = `Disponíveis agora: <b>${qtdTexto(max, p)}</b>`;
      } else {
        max = st.livreProxima;
        pergunta = "Quantas fatias reservar da próxima pizza?";
        info = max > 0
          ? "Esta pizza está temporariamente indisponível. Reserve agora e suas fatias serão as primeiras da próxima pizza."
          : "As fatias da próxima pizza já foram todas reservadas por outras mesas. Tente novamente em instantes.";
      }
    }
    if (max > 0 && sh.qtd > max) {
      sh.qtd = max;
      if (!sh.aviso) { sh.aviso = `A quantidade foi ajustada: agora ${max === 1 ? "só é possível 1" : "o máximo é " + max}.`; sh.avisoBom = false; }
    }
    if (sh.qtd < 1) sh.qtd = 1;

    $("#qtdInfo").innerHTML = info;
    $("#qtdPergunta").textContent = pergunta;
    const chips = $("#qtdChips");
    chips.classList.toggle("poucos", totalChips <= 6);
    chips.innerHTML = Array.from({ length: totalChips }, (_, i) => {
      const n = i + 1;
      return `<button class="chip" type="button" data-qtd="${n}" aria-pressed="${n === sh.qtd && max > 0}" ${n > max ? "disabled" : ""}>${n}</button>`;
    }).join("");
    const aviso = $("#qtdAviso");
    aviso.hidden = !sh.aviso;
    aviso.textContent = sh.aviso || "";
    aviso.classList.toggle("bom", !!sh.avisoBom);

    if (!S.conectado) { btn.disabled = true; btn.textContent = "AGUARDANDO CONEXÃO…"; return; }
    btn.disabled = max <= 0;
    const q = qtdTexto(sh.qtd, p).toUpperCase();
    btn.textContent = max <= 0 ? "INDISPONÍVEL" : sh.modo === "proxima" ? `RESERVAR ${q}` : `PEDIR ${q}`;
  }
  async function confirmarPedido() {
    const sh = S.sheet;
    if (!sh || sh.enviando) return;
    if (!S.conectado) { sh.aviso = "Sem conexão no momento. Assim que reconectar, você poderá pedir."; sh.avisoBom = false; renderSheet(); return; }
    const p = PRODUTO[sh.produtoId];
    const qtd = sh.qtd, modo = sh.modo;
    sh.enviando = true; sh.aviso = "";
    renderSheet();
    let res;
    try {
      res = p.controlaEstoque ? await solicitarPizza(p, qtd, modo) : await solicitarLivre(p, qtd);
    } catch (e) {
      console.warn("[pedido]", e);
      res = { ok: false, motivo: "erro" };
    }
    if (S.sheet !== sh) return;
    sh.enviando = false;
    if (res.ok) {
      fechar("telaQtd");
      S.sheet = null;
      if (res.status === STATUS.AGUARDANDO_REPOSICAO) {
        mostrarConfirmacao({ titulo: "Solicitação registrada", texto: `<b>${esc(qtdTexto(qtd, p))}</b> da próxima ${esc(p.nome)} destinadas à sua mesa.` });
      } else if (p.controlaEstoque) {
        mostrarConfirmacao({ titulo: "Solicitação registrada", texto: `<b>${esc(qtdTexto(qtd, p))}</b> ${qtd === 1 ? "destinada" : "destinadas"} à sua mesa.` });
      } else {
        mostrarConfirmacao({ titulo: "Solicitação registrada", texto: `O garçom já pode ver seu pedido: <b>${esc(qtdTexto(qtd, p))}</b> de ${esc(p.nome)}.` });
      }
      vibrar(30);
      return;
    }
    switch (res.motivo) {
      case "esgotado":
        sh.modo = "proxima"; sh.aviso = "Essa fatia acabou de ser solicitada por outra mesa."; break;
      case "insuficiente":
        sh.qtd = Math.max(1, res.restante || 1);
        sh.aviso = `Outra mesa acabou de pedir. Agora ${res.restante === 1 ? "resta 1 fatia" : `restam ${res.restante} fatias`}.`; break;
      case "voltou":
        sh.modo = "agora"; sh.aviso = "Essa pizza voltou a ficar disponível. Confirme seu pedido."; sh.avisoBom = true; break;
      case "fila_cheia":
        sh.aviso = "As fatias da próxima pizza acabaram de ser reservadas por outras mesas."; break;
      case "fila_insuficiente":
        sh.qtd = Math.max(1, res.restante || 1);
        sh.aviso = `Ainda dá para reservar ${res.restante === 1 ? "1 fatia" : res.restante + " fatias"} da próxima pizza.`; break;
      default:
        sh.aviso = "Não foi possível registrar agora. Tente de novo.";
    }
    if (!["voltou"].includes(res.motivo)) sh.avisoBom = false;
    renderSheet();
  }

  /* ---- Meus pedidos ---- */
  function pedidosVisiveis() {
    const inicio = Number(S.mesaInfo?.inicioAtendimento) || 0;
    const agora = agoraServidor();
    return Object.values(S.minhas).filter(s => {
      const criado = Number(s.criadoEm) || agora;
      if (criado < inicio - 5000) return false;
      const fim = s.status === STATUS.ATENDIDO || s.status === STATUS.CANCELADO;
      if (fim && agora - (Number(s.atualizadoEm) || criado) > 6 * 3600e3) return false;
      return true;
    });
  }
  function renderBarraPedidos() {
    const vis = pedidosVisiveis();
    const ativos = vis.filter(s => STATUS_ATIVOS.includes(s.status));
    const badge = $("#barraBadge");
    badge.hidden = ativos.length === 0;
    badge.textContent = String(ativos.length);
    const emAt = ativos.filter(s => s.status === STATUS.EM_ATENDIMENTO).length;
    const agu = ativos.filter(s => s.status === STATUS.AGUARDANDO_REPOSICAO).length;
    let resumo;
    if (!vis.length) resumo = "Nenhum pedido ainda";
    else if (!ativos.length) resumo = "Todos os pedidos foram atendidos";
    else {
      const partes = [`${ativos.length} em andamento`];
      if (emAt) partes.push(`${emAt} com o garçom`);
      if (agu) partes.push(`${agu} aguardando reposição`);
      resumo = partes.join(", ");
    }
    $("#barraResumo").textContent = resumo;
  }
  function dicaPedido(s) {
    switch (s.status) {
      case STATUS.SOLICITADO: return s.prioridade ? "🔥 Acabou de sair: destinadas à sua mesa." : "O garçom já pode ver seu pedido.";
      case STATUS.AGUARDANDO_REPOSICAO: return "Suas fatias serão as primeiras da próxima pizza.";
      case STATUS.EM_ATENDIMENTO: return "O garçom está cuidando do seu pedido.";
      case STATUS.ATENDIDO: return "Entregue. Bom apetite!";
      case STATUS.CANCELADO: return s.canceladoPor === "cliente" ? "Cancelado pela mesa." : "Cancelado pela equipe.";
      default: return "";
    }
  }
  function htmlPedido(s) {
    const p = PRODUTO[s.produtoId];
    const qtd = p ? qtdTexto(s.quantidade, p) : `${s.quantidade}`;
    const podeCancelar = CANCELAVEIS.includes(s.status);
    const conf = S.confirmandoCancel === s.id;
    return `<div class="pedido">
      <span class="pedido-emoji" aria-hidden="true">${esc(s.emoji || p?.emoji || "🍽️")}</span>
      <span class="pedido-nome">${esc(s.produtoNome || p?.nome || "")}</span>
      <span class="pedido-status st-${esc(s.status)}">${esc(STATUS_ROTULO[s.status] || s.status)}</span>
      <span class="pedido-qtd">${esc(qtd)}, ${esc(tempoRel(s.criadoEm))}</span>
      <span></span>
      <span class="pedido-dica">${esc(dicaPedido(s))}</span>
      ${podeCancelar ? `<span class="pedido-acao"><button class="btn-cancelar${conf ? " confirmar" : ""}" type="button" data-cancelar="${esc(s.id)}">${conf ? "Toque de novo para cancelar" : "Cancelar pedido"}</button></span>` : ""}
    </div>`;
  }
  function renderPedidos() {
    const vis = pedidosVisiveis().sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
    const ativos = vis.filter(s => STATUS_ATIVOS.includes(s.status));
    const fim = vis.filter(s => !STATUS_ATIVOS.includes(s.status));
    $("#pedidosSub").textContent = S.mesaNumero ? `Mesa ${doisDig(S.mesaNumero)}. Atualiza sozinho, sem recarregar.` : "";
    let html = "";
    if (!vis.length) {
      html = `<div class="vazio"><strong>Sua mesa ainda não pediu nada.</strong>Escolha um item no cardápio e toque em PEDIR.</div>`;
    } else {
      if (ativos.length) html += `<div class="pedidos-grupo"><h3>Em andamento</h3>${ativos.map(htmlPedido).join("")}</div>`;
      if (fim.length) html += `<div class="pedidos-grupo"><h3>Finalizados</h3>${fim.map(htmlPedido).join("")}</div>`;
    }
    const el = $("#pedidosLista");
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
  }

  /* ---- Atividade ---- */
  function renderAtividade() {
    const vista = Number(ls.get("rodizio.atividadeVista")) || 0;
    const novas = S.atividade.some(a => (Number(a.criadoEm) || 0) > vista);
    $("#pontoAtividade").hidden = !novas || !$("#telaAtividade").hidden;
    const feed = $("#feed");
    feed.innerHTML = S.atividade.length
      ? S.atividade.map(a => `<li><span class="f-emoji" aria-hidden="true">${esc(a.emoji || "🍕")}</span><span class="f-txt">${esc(a.texto)}<span class="f-hora">${esc(tempoRel(a.criadoEm))}</span></span></li>`).join("")
      : `<li class="vazio" style="border:0;display:block"><strong>Tudo calmo por enquanto.</strong>Quando uma pizza sair do forno, você verá aqui.</li>`;
  }

  /* ---- Mesas ---- */
  function abrirTelaMesa() {
    $("#mesasGrid").innerHTML = Array.from({ length: TOTAL_MESAS }, (_, i) =>
      `<button class="mesa-op" type="button" data-mesa="${i + 1}" aria-current="${S.mesaNumero === i + 1}" aria-label="Mesa ${doisDig(i + 1)}">${doisDig(i + 1)}</button>`
    ).join("");
    $("#mesaVoltar").hidden = !S.mesaId;
    abrir("telaMesa");
  }
  function selecionarMesa(n) {
    n = Number(n);
    if (!Number.isInteger(n) || n < 1 || n > TOTAL_MESAS) return;
    const antiga = S.mesaId;
    const novo = mesaIdDe(n);
    if (antiga && antiga !== novo) sairDaMesa(antiga);
    S.mesaNumero = n; S.mesaId = novo;
    ls.set("rodizio.mesa", String(n));
    $("#mesaNum").textContent = doisDig(n);
    fechar("telaMesa");
    if (db && antiga !== novo) { ouvirMesa(); registrarPresenca(); }
    agendarRender();
    if (!ls.get("rodizio.comoFuncionaVisto")) abrir("telaComo");
  }

  /* ---- Não recomendar (por mesa) ---- */
  async function alternarNaoRecomendar(produtoId) {
    if (!S.mesaId) return;
    const p = PRODUTO[produtoId];
    const ativo = !!S.prefs[produtoId];
    const caminho = r(`preferencias/${S.mesaId}/naoRecomendar/${produtoId}`);
    try {
      if (ativo) { await remove(caminho); toast(`${p.nome} voltou às sugestões da sua mesa.`); }
      else {
        await set(caminho, true);
        toast(`Não vamos mais sugerir ${p.nome} para sua mesa.`, "Desfazer", () => remove(caminho).catch(() => {}));
      }
    } catch (e) { console.warn(e); toast("Não foi possível salvar agora. Tente de novo."); }
  }

  /* ---- Camadas, toasts e confirmação ---- */
  const pilha = [];
  function abrir(id) { const el = document.getElementById(id); el.hidden = false; if (!pilha.includes(id)) pilha.push(id); document.body.style.overflow = "hidden"; }
  function fechar(id) {
    const el = document.getElementById(id); el.hidden = true;
    const i = pilha.indexOf(id); if (i >= 0) pilha.splice(i, 1);
    if (!pilha.length) document.body.style.overflow = "";
    if (id === "telaQtd") S.sheet = null;
    if (id === "telaAtividade") renderAtividade();
  }
  let timerOk = null;
  function mostrarConfirmacao({ titulo, texto, fogo = false, icone = "✓" }) {
    $("#okCaixa").classList.toggle("fogo", fogo);
    $("#okIcone").textContent = icone;
    $("#okTitulo").textContent = titulo;
    $("#okTexto").innerHTML = texto;
    abrir("telaOk");
    clearTimeout(timerOk);
    timerOk = setTimeout(() => fechar("telaOk"), fogo ? 7000 : 2800);
  }
  function toast(msg, acao, fn) {
    const box = $("#toasts");
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = `<span>${esc(msg)}</span>${acao ? `<button type="button">${esc(acao)}</button>` : ""}`;
    if (acao) t.querySelector("button").onclick = () => { fn?.(); t.remove(); };
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => t.remove(), acao ? 6000 : 4200);
  }

  /* ============================================================================
     11) EVENTOS
     ============================================================================ */
  function ligarEventos() {
    $("#abas").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) trocarCategoria(b.dataset.cat); });

    const pager = $("#pager");
    let arrastou = false, drag = null, tScroll = null;
    pager.addEventListener("scroll", () => { clearTimeout(tScroll); tScroll = setTimeout(() => marcarPagina(paginaAtual()), 80); }, { passive: true });
    pager.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") { drag = { x: e.clientX }; arrastou = false; } });
    window.addEventListener("pointerup", e => {
      if (!drag) return;
      const dx = e.clientX - drag.x; drag = null;
      if (Math.abs(dx) > 50) { arrastou = true; irPagina(paginaAtual() + (dx < 0 ? 1 : -1)); setTimeout(() => arrastou = false, 50); }
    });
    pager.addEventListener("click", e => {
      if (arrastou) return;
      const b = e.target.closest("button[data-acao]");
      if (!b || b.disabled) return;
      const id = b.closest(".card")?.dataset.id;
      if (!id) return;
      if (b.dataset.acao === "pedir") abrirSheet(id, "agora");
      else if (b.dataset.acao === "proxima") abrirSheet(id, "proxima");
      else if (b.dataset.acao === "naorec") alternarNaoRecomendar(id);
    });
    $("#pgAnt").onclick = () => irPagina(paginaAtual() - 1);
    $("#pgProx").onclick = () => irPagina(paginaAtual() + 1);
    $("#dots").addEventListener("click", e => { const d = e.target.closest("[data-pag]"); if (d) irPagina(Number(d.dataset.pag)); });
    window.addEventListener("resize", () => { const pg = $("#pager"); pg.scrollLeft = S.paginas[S.categoria] * pg.clientWidth; });

    $("#recsLista").addEventListener("click", e => {
      const b = e.target.closest("[data-rec]"); if (!b) return;
      const p = PRODUTO[b.dataset.rec];
      if (p) abrirSheet(p.id, estadoProduto(p).tipo === "indisponivel" ? "proxima" : "agora");
    });
    $("#btnRestaurar").onclick = () => {
      if (!S.mesaId) return;
      remove(r(`preferencias/${S.mesaId}/naoRecomendar`)).then(() => toast("Todas as sugestões voltaram a aparecer.")).catch(() => {});
    };

    $("#qtdChips").addEventListener("click", e => {
      const c = e.target.closest("[data-qtd]"); if (!c || c.disabled || !S.sheet) return;
      S.sheet.qtd = Number(c.dataset.qtd); S.sheet.aviso = ""; renderSheet();
    });
    $("#qtdConfirmar").onclick = confirmarPedido;

    $("#btnPedidos").onclick = () => { S.confirmandoCancel = null; renderPedidos(); abrir("telaPedidos"); };
    $("#pedidosLista").addEventListener("click", async e => {
      const b = e.target.closest("[data-cancelar]"); if (!b) return;
      const id = b.dataset.cancelar;
      if (S.confirmandoCancel !== id) {
        S.confirmandoCancel = id; renderPedidos();
        setTimeout(() => { if (S.confirmandoCancel === id) { S.confirmandoCancel = null; renderPedidos(); } }, 4000);
        return;
      }
      S.confirmandoCancel = null;
      b.disabled = true; b.textContent = "Cancelando…";
      try { await cancelarSolicitacao(id); } catch (err) { console.warn(err); toast("Não foi possível cancelar agora. Tente de novo."); }
      renderPedidos();
    });

    $("#btnAtividade").onclick = () => {
      ls.set("rodizio.atividadeVista", String(agoraServidor()));
      abrir("telaAtividade"); renderAtividade();
    };
    $("#btnAjuda").onclick = () => abrir("telaComo");
    $("#comoOk").onclick = () => { ls.set("rodizio.comoFuncionaVisto", "1"); fechar("telaComo"); };

    $("#btnTrocarMesa").onclick = () => {
      $("#trocarTexto").textContent = S.mesaNumero ? `Os pedidos já feitos continuam registrados na Mesa ${doisDig(S.mesaNumero)}.` : "";
      abrir("telaTrocar");
    };
    $("#trocarSim").onclick = () => { fechar("telaTrocar"); abrirTelaMesa(); };
    $("#mesasGrid").addEventListener("click", e => { const b = e.target.closest("[data-mesa]"); if (b) selecionarMesa(b.dataset.mesa); });
    $("#mesaVoltar").onclick = () => fechar("telaMesa");

    $("#okFechar").onclick = () => fechar("telaOk");
    $("#telaOk").addEventListener("click", e => { if (e.target.id === "telaOk") fechar("telaOk"); });

    document.querySelectorAll("[data-fechar]").forEach(b => b.addEventListener("click", () => fechar(b.dataset.fechar)));
    ["telaQtd", "telaPedidos", "telaAtividade", "telaTrocar"].forEach(id =>
      document.getElementById(id).addEventListener("click", e => { if (e.target.id === id) fechar(id); })
    );
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape" || !pilha.length) return;
      const topo = pilha[pilha.length - 1];
      if (topo === "telaMesa" && !S.mesaId) return;
      if (topo === "telaComo") ls.set("rodizio.comoFuncionaVisto", "1");
      fechar(topo);
    });
  }

  /* Tarefas periódicas: selos "acabou de sair", tempos relativos e verificação de reposição */
  function tick() {
    if (!db) return;
    for (const p of PIZZAS) {
      const e = S.estoque[p.id];
      if (e && (Number(e.disponivel) || 0) === 0 && (!e.zeradoEm || agoraServidor() - e.zeradoEm >= REPOSICAO_MS)) reporPizza(p.id);
    }
    agendarRender();
    if (!$("#telaAtividade").hidden) renderAtividade();
  }

  /* ============================================================================
     12) INICIALIZAÇÃO
     ============================================================================ */
  function iniciar() {
    $("#marcaNome").textContent = NOME_RESTAURANTE;
    $("#marcaGrande").textContent = `🍕 ${NOME_RESTAURANTE}`;
    montarAbas();
    renderCardapio();
    ligarEventos();
    renderRecs();
    renderBarraPedidos();
    renderAtividade();

    const configPendente = Object.values(firebaseConfig).some(v => typeof v !== "string" || !v.trim() || v.includes("COLE_AQUI"));
    if (configPendente) {
      console.warn("[rodízio] Preencha o firebaseConfig no início do <script> do cliente.html.");
      abrir("telaConfig");
      return;
    }
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      console.error("[rodízio] Falha ao iniciar o Firebase. Verifique o firebaseConfig (principalmente databaseURL).", e);
      abrir("telaConfig");
      return;
    }
    ouvirGlobais();

    const salva = Number(ls.get("rodizio.mesa"));
    if (Number.isInteger(salva) && salva >= 1 && salva <= TOTAL_MESAS) selecionarMesa(salva);
    else abrirTelaMesa();

    setInterval(tick, 5000);
  }
  iniciar();

}

/* ===========================================================================
   APLICAÇÃO DA EQUIPE (operação: Garçom + Cozinha/Gestão)
   =========================================================================== */
function appOperacao() {

  /* ============================================================================
     operacao.html — Interface da EQUIPE (Garçom + Cozinha/Gestão)
     ----------------------------------------------------------------------------
     Mesmo sistema do cliente.html:
         cliente.html  <->  Firebase Realtime Database  <->  operacao.html

     ⚠ PROTÓTIPO: sem autenticação e com regras abertas no banco.
       Essa configuração NÃO é adequada para produção.
     ============================================================================ */

  /* ============================================================================
     1) CONFIGURAÇÃO DO FIREBASE — USE EXATAMENTE O MESMO DO cliente.html
     ============================================================================ */
  /* firebaseConfig: definido UMA vez no topo do arquivo */

  const NOME_RESTAURANTE = "Rodízio";


  /* ============================================================================
     2) ESTRUTURA DE DADOS COMPARTILHADA (idêntica à do cliente.html)
     ----------------------------------------------------------------------------
     /rodizio/config, /categorias, /produtos      catálogo (mesmos IDs)
     /rodizio/estoque/{produtoId}                  disponivel, capacidade, ciclo, zeradoEm, repostoEm,
                                                   reservas/{solicitacaoId}, fila/{solicitacaoId}
     /rodizio/solicitacoes/{solicitacaoId}         status, mesaId, produtoId, quantidade, historico…
     /rodizio/mesas/{mesaId}                       numero, rotulo, inicioAtendimento, dispositivos
     /rodizio/preferencias/{mesaId}/naoRecomendar  (usado pelo cliente; limpo ao liberar mesa)
     /rodizio/estatisticas/{produtoId}             (usado pelas recomendações do cliente)
     /rodizio/atividade                            feed PÚBLICO dos clientes (sem mesas)

     Campos que o operacao.html ACRESCENTA às solicitações (o cliente ignora):
         atendimentoIniciadoEm, atendidoEm,
         consumo: { quantidade, ciclo, em }   registro do consumo ao concluir
         canceladoPor: 'operacao' (cancelamento administrativo)

     Único nó novo:
     /rodizio/eventosEstoque/{chave}   registro INTERNO da equipe: esgotada / reposta
         chave determinística (ex.: sal_calabresa_cebola_rep_3), então vários
         dispositivos podem gravar sem duplicar. Não é exibido aos clientes.
         { tipo:'esgotada'|'reposta', produtoId, produtoNome, ciclo, em, manual? }

     A "Atividade do rodízio" da equipe é montada a partir do historico das
     solicitações (quem pediu, atendimento, conclusão, cancelamento) + eventosEstoque.
     ============================================================================ */

  const RAIZ = "rodizio";
  const VERSAO_CATALOGO = 1;
  const FATIAS_POR_PIZZA = 8;
  const REPOSICAO_MS = 60_000;             // interno: nunca exibido
  const DESTAQUE_REPOSTA_MS = 2 * 60_000;  // igual ao cliente.html
  const RECENTE_GESTAO_MS = 5 * 60_000;    // lista "Repostas recentemente"
  const POUCAS_FATIAS = 2;
  const TOTAL_MESAS = 15;

  const STATUS = {
    SOLICITADO: "SOLICITADO",
    EM_ATENDIMENTO: "EM_ATENDIMENTO",
    ATENDIDO: "ATENDIDO",
    AGUARDANDO_REPOSICAO: "AGUARDANDO_REPOSICAO",
    CANCELADO: "CANCELADO"
  };
  const ROTULO = {
    SOLICITADO: "SOLICITADO", EM_ATENDIMENTO: "EM ATENDIMENTO", ATENDIDO: "ATENDIDO",
    AGUARDANDO_REPOSICAO: "AGUARDANDO REPOSIÇÃO", CANCELADO: "CANCELADO"
  };
  const ATIVOS = [STATUS.SOLICITADO, STATUS.EM_ATENDIMENTO, STATUS.AGUARDANDO_REPOSICAO];

  /* ============================================================================
     3) CATÁLOGO — mesmos IDs, nomes, ordens e emojis do cliente.html
     ============================================================================ */
  const CATEGORIAS = [
    { id: "salgadas", nome: "Pizzas salgadas", item: "Pizza salgada", emoji: "🍕", ordem: 1, controlaEstoque: true, unidade: { id: "fatia", s: "fatia", p: "fatias" } },
    { id: "doces", nome: "Pizzas doces", item: "Pizza doce", emoji: "🍫", ordem: 2, controlaEstoque: true, unidade: { id: "fatia", s: "fatia", p: "fatias" } },
    { id: "bebidas", nome: "Bebidas", item: "Bebida", emoji: "🥤", ordem: 3, controlaEstoque: false, unidade: { id: "unidade", s: "unidade", p: "unidades" } },
    { id: "diversos", nome: "Diversos", item: "Diversos", emoji: "🍝", ordem: 4, controlaEstoque: false, unidade: { id: "porcao", s: "porção", p: "porções" } }
  ];
  const CAT = Object.fromEntries(CATEGORIAS.map(c => [c.id, c]));

  const SALGADAS = [

    ["doc_chocolate_banana", "Chocolate com banana"], ["doc_prestigio", "Prestígio"], ["doc_banana_canela", "Banana com canela"],
    ["doc_banana_chocolate", "Banana com chocolate"], ["doc_romeu_julieta", "Romeu e Julieta"], ["doc_doce_leite", "Doce de leite"],
    ["doc_doce_leite_coco", "Doce de leite com coco"], ["doc_doce_leite_banana", "Doce de leite com banana"], ["doc_nutella_morango", "Nutella com morango"],
    ["doc_nutella_banana", "Nutella com banana"], ["doc_ovomaltine", "Ovomaltine"], ["doc_mms_chocolate", "M&M's com chocolate"],

  const BEBIDAS = [
