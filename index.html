    ["beb_guarana_zero", "Guaraná Zero", "🥤"], ["beb_fanta_laranja", "Fanta Laranja", "🥤"], ["beb_fanta_uva", "Fanta Uva", "🥤"],
    ["beb_sprite", "Sprite", "🥤"], ["beb_sprite_zero", "Sprite Zero", "🥤"], ["beb_soda_italiana", "Soda italiana", "🍹"],
    ["beb_agua_mineral", "Água mineral", "💧"], ["beb_agua_com_gas", "Água com gás", "💧"], ["beb_suco_laranja", "Suco de laranja", "🧃"],
    ["beb_suco_maracuja", "Suco de maracujá", "🧃"], ["beb_suco_morango", "Suco de morango", "🧃"], ["beb_suco_abacaxi", "Suco de abacaxi", "🧃"],
    ["beb_limonada", "Limonada", "🍋"], ["beb_cha_gelado", "Chá gelado", "🧊"], ["beb_refri_limao", "Refrigerante de limão", "🥤"]
  ];
  const DIVERSOS = [
    ["div_batata_frita", "Batata frita", "🍟"], ["div_batata_rustica", "Batata rústica", "🥔"], ["div_aneis_cebola", "Anéis de cebola", "🧅"],
    ["div_macarronada_vermelho", "Macarronada ao molho vermelho", "🍝"], ["div_macarronada_bolonhesa", "Macarronada à bolonhesa", "🍝"],
    ["div_macarronada_branco", "Macarronada ao molho branco", "🍝"], ["div_lasanha_bolonhesa", "Lasanha à bolonhesa", "🥘"],
    ["div_lasanha_frango", "Lasanha de frango", "🥘"], ["div_nhoque_molho", "Nhoque ao molho", "🍲"], ["div_mini_hamburguer", "Mini hambúrguer", "🍔"],
    ["div_mini_cachorro_quente", "Mini cachorro-quente", "🌭"], ["div_mini_pastel", "Mini pastel", "🥟"], ["div_nuggets_frango", "Nuggets de frango", "🍗"],
    ["div_coxinha", "Coxinha", "🧆"], ["div_bolinha_queijo", "Bolinha de queijo", "🧀"], ["div_brownie", "Brownie", "🍫"],
    ["div_pudim", "Pudim", "🍮"], ["div_churros_doce_leite", "Churros com doce de leite", "🥨"]
  ];
  const PRODUTOS = [
    ...SALGADAS.map(([id, nome], i) => ({ id, nome, categoria: "salgadas", ordem: i + 1, controlaEstoque: true, emoji: "🍕" })),
    ...DOCES.map(([id, nome], i) => ({ id, nome, categoria: "doces", ordem: i + 1, controlaEstoque: true, emoji: "🍫" })),
    ...BEBIDAS.map(([id, nome, emoji], i) => ({ id, nome, categoria: "bebidas", ordem: i + 1, controlaEstoque: false, emoji })),
    ...DIVERSOS.map(([id, nome, emoji], i) => ({ id, nome, categoria: "diversos", ordem: i + 1, controlaEstoque: false, emoji }))
  ];
  const PRODUTO = Object.fromEntries(PRODUTOS.map(p => [p.id, p]));
  const PIZZAS = PRODUTOS.filter(p => p.controlaEstoque);

  /* ============================================================================
     4) UTILITÁRIOS
     ============================================================================ */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  const mesaIdDe = (n) => "mesa_" + String(n).padStart(2, "0");
  const doisDig = (n) => String(n).padStart(2, "0");
  function numeroMesa(s) { return Number(s?.mesaNumero) || Number(String(s?.mesaId || "").replace(/\D/g, "")) || 0; }
  function rotuloMesa(s) { return "Mesa " + doisDig(numeroMesa(s)); }
  function unidade(catId) { return (CAT[catId] || CAT.bebidas).unidade; }
  function qtdTexto(n, catId) { const u = unidade(catId); return `${n} ${n === 1 ? u.s : u.p}`; }
  function nomeDe(s) { return s?.produtoNome || PRODUTO[s?.produtoId]?.nome || "Produto"; }
  function emojiDe(s) { return s?.emoji || PRODUTO[s?.produtoId]?.emoji || "🍽️"; }
  function catDe(s) { return s?.categoria || PRODUTO[s?.produtoId]?.categoria || "bebidas"; }
  function somaFila(fila) { return Object.values(fila || {}).reduce((t, f) => t + (Number(f?.quantidade) || 0), 0); }
  function hora(ts) { if (!ts) return "--:--"; return new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function espera(ts) {
    if (!ts) return { txt: "agora", nivel: "" };
    const m = Math.floor(Math.max(0, agoraServidor() - ts) / 60000);
    return { txt: m < 1 ? "agora" : `há ${m} min`, nivel: m >= 10 ? "alto" : m >= 5 ? "medio" : "" };
  }
  function gerarId() {
    if (window.crypto?.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  /* ============================================================================
     5) ESTADO
     ============================================================================ */
  const S = {
    sessaoId: ls.get("rodizio.op.sessaoId") || (() => { const id = gerarId(); ls.set("rodizio.op.sessaoId", id); return id; })(),
    conectado: false, jaConectou: false, offset: 0,
    estoque: {}, estoqueCarregado: false,
    sol: {}, solCarregadas: false, statusVisto: {},
    mesas: {},
    eventos: {}, eventosCarregados: false,
    modo: ls.get("rodizio.op.modo") === "gestao" ? "gestao" : "garcom",
    visao: ls.get("rodizio.op.visao") === "produto" ? "produto" : "pedido",
    filtro: ls.get("rodizio.op.filtro") || "todas",
    som: ls.get("rodizio.op.som") === "1",
    ocupados: new Set(),        // solicitações com ação em andamento
    confirmandoCancel: null,
    novos: new Map(),           // destaque visual de chegada
    emAndamento: new Set(),
    timers: {},
    mesaAberta: null
  };
  let db = null;
  const r = (c) => ref(db, `${RAIZ}/${c}`);
  const agoraServidor = () => Date.now() + (S.offset || 0);
  const novaChave = () => push(ref(db, `${RAIZ}/_chaves`)).key; // gera chave sem gravar

  /* ============================================================================
     6) REGRAS DE ESTOQUE (MESMA LÓGICA DO cliente.html — sempre com transação)
     ============================================================================ */
  function alocarFila(cur, livres, promovidos) {
    const fila = cur.fila || {};
    const ordem = Object.entries(fila).sort((a, b) => (a[1]?.criadoEm || 0) - (b[1]?.criadoEm || 0));
    for (const [id, f] of ordem) {
      if (livres <= 0) break;
      const q = Number(f?.quantidade) || 0;
      if (q > 0 && q <= livres) {
        cur.reservas = cur.reservas || {};
        cur.reservas[id] = { mesaId: f.mesaId, quantidade: q, ciclo: cur.ciclo, reservadoEm: agoraServidor(), prioridade: true };
        delete fila[id];
        livres -= q;
        promovidos.push(id);
      }
    }
    cur.fila = fila;
    return livres;
  }

  /* Feed PÚBLICO (clientes): igual ao cliente.html, sem dados de mesa. */
  function registrarAtividadePublica(tipo, p) {
    if (!p) return;
    let emoji = CAT[p.categoria].emoji, texto;
    if (tipo === "reposta") {
      if (p.categoria === "salgadas") { emoji = "🔥"; texto = `${p.nome} acabou de sair.`; }
      else { emoji = "🍫"; texto = `${p.nome} voltou a ficar disponível.`; }
    } else if (tipo === "voltou") texto = `${p.nome} voltou a ficar disponível.`;
    else return;
    Promise.resolve(push(r("atividade"), { tipo, produtoId: p.id, produtoNome: p.nome, categoria: p.categoria, emoji, texto, criadoEm: serverTimestamp() })).catch(() => {});
  }

  /* Reposição automática (1 minuto após zerar). Idempotente entre dispositivos. */
  async function reporPizza(produtoId) {
    if (!db || !S.conectado || S.emAndamento.has("repor:" + produtoId)) return;
    S.emAndamento.add("repor:" + produtoId);
    let promovidos = [], repos = false;
    try {
      const tx = await runTransaction(r(`estoque/${produtoId}`), (cur) => {
        promovidos = []; repos = false;
        if (cur === null) return cur;
        if ((Number(cur.disponivel) || 0) > 0) return;
        const agora = agoraServidor();
        if (!cur.zeradoEm) { cur.zeradoEm = agora; return cur; }
        if (agora - cur.zeradoEm < REPOSICAO_MS) return;
        const cap = Number(cur.capacidade) || FATIAS_POR_PIZZA;
        cur.ciclo = (cur.ciclo || 1) + 1;
        const livres = alocarFila(cur, cap, promovidos);
        cur.disponivel = livres;
        cur.repostoEm = agora;
        cur.zeradoEm = livres === 0 ? agora : null;
        cur.atualizadoEm = agora;
        repos = true;
        return cur;
      }, { applyLocally: false });
      if (tx.committed && repos) {
        promovidos.forEach(id => promoverSolicitacao(id));
        registrarAtividadePublica("reposta", PRODUTO[produtoId]);
      }
    } catch (e) { console.warn("[reposição]", e); }
    finally { S.emAndamento.delete("repor:" + produtoId); }
  }

  /* Reposição MANUAL (área de demonstração): coloca uma pizza nova agora. */
  async function reporManual(produtoId) {
    let promovidos = [], repos = false;
    const tx = await runTransaction(r(`estoque/${produtoId}`), (cur) => {
      promovidos = []; repos = false;
      if (cur === null) return cur;
      const agora = agoraServidor();
      const cap = Number(cur.capacidade) || FATIAS_POR_PIZZA;
      cur.ciclo = (cur.ciclo || 1) + 1;
      const livres = alocarFila(cur, cap, promovidos);
      cur.disponivel = livres;
      cur.repostoEm = agora;
      cur.reposicaoManualEm = agora;
      cur.zeradoEm = livres === 0 ? agora : null;
      cur.atualizadoEm = agora;
      repos = true;
      return cur;
    }, { applyLocally: false });
    if (!tx.committed || !repos) throw new Error("reposição não aplicada");
    promovidos.forEach(id => promoverSolicitacao(id));
    registrarAtividadePublica("reposta", PRODUTO[produtoId]);
    return promovidos.length;
  }

  async function promoverSolicitacao(solId) {
    const chave = "promover:" + solId;
    if (S.emAndamento.has(chave)) return;
    S.emAndamento.add(chave);
    try {
      await runTransaction(r(`solicitacoes/${solId}`), (cur) => {
        if (cur === null) return cur;
        if (cur.status !== STATUS.AGUARDANDO_REPOSICAO) return;
        const agora = agoraServidor();
        cur.status = STATUS.SOLICITADO;
        cur.prioridade = true;
        cur.liberadoEm = agora;
        cur.atualizadoEm = agora;
        cur.atualizadoPor = "sistema";
        cur.historico = cur.historico || {};
        cur.historico[novaChave()] = { status: STATUS.SOLICITADO, em: agora, por: "sistema" };
        return cur;
      }, { applyLocally: false });
    } catch (e) { console.warn("[promover]", e); }
    finally { S.emAndamento.delete(chave); }
  }

  /* Devolve fatias de uma solicitação cancelada (mesma regra do cliente). */
  async function liberarEstoque(produtoId, solId) {
    let promovidos = [], voltou = false;
    const tx = await runTransaction(r(`estoque/${produtoId}`), (cur) => {
      promovidos = []; voltou = false;
      if (cur === null) return cur;
      const agora = agoraServidor();
      if (cur.fila && cur.fila[solId]) { delete cur.fila[solId]; cur.atualizadoEm = agora; return cur; }
      const res = cur.reservas && cur.reservas[solId];
      if (!res) return;
      delete cur.reservas[solId];
      const cap = Number(cur.capacidade) || FATIAS_POR_PIZZA;
      if ((res.ciclo || 1) === (cur.ciclo || 1)) {
        const antes = Math.max(0, Number(cur.disponivel) || 0);
        let livres = Math.min(cap, antes + (Number(res.quantidade) || 0)) - antes;
        livres = alocarFila(cur, livres, promovidos);
        cur.disponivel = antes + livres;
        if (cur.disponivel > 0) { cur.zeradoEm = null; if (antes === 0) voltou = true; }
      }
      cur.atualizadoEm = agora;
      return cur;
    }, { applyLocally: false });
    if (tx.committed) {
      promovidos.forEach(id => promoverSolicitacao(id));
      if (voltou) registrarAtividadePublica("voltou", PRODUTO[produtoId]);
    }
  }

  /* Ao concluir: a reserva vira consumo (fatias entregues). Idempotente. */
  async function consumirReserva(produtoId, solId) {
    await runTransaction(r(`estoque/${produtoId}`), (cur) => {
      if (cur === null) return cur;
      if (!cur.reservas || !cur.reservas[solId]) return;
      delete cur.reservas[solId];
      cur.atualizadoEm = agoraServidor();
      return cur;
    }, { applyLocally: false });
  }

  /* ============================================================================
     7) AÇÕES DA EQUIPE NAS SOLICITAÇÕES (transação no status)
     ============================================================================ */
  async function mudarStatus(id, permitidos, novo) {
    let atual = null;
    const cicloReserva = S.estoque[S.sol[id]?.produtoId]?.reservas?.[id]?.ciclo ?? null;
    const tx = await runTransaction(r(`solicitacoes/${id}`), (cur) => {
      atual = null;
      if (cur === null) return cur;
      if (!permitidos.includes(cur.status)) { atual = cur.status; return; }
      const agora = agoraServidor();
      cur.status = novo;
      cur.atualizadoEm = agora;
      cur.atualizadoPor = "operacao";
      if (novo === STATUS.EM_ATENDIMENTO) cur.atendimentoIniciadoEm = agora;
      if (novo === STATUS.SOLICITADO) cur.atendimentoIniciadoEm = null;
      if (novo === STATUS.ATENDIDO) {
        cur.atendidoEm = agora;
        cur.consumo = { quantidade: cur.quantidade, ciclo: cicloReserva ?? cur.cicloEstoque ?? null, em: agora };
      }
      if (novo === STATUS.CANCELADO) {
        cur.canceladoPor = "operacao";
        cur.canceladoSessaoId = S.sessaoId;
        cur.canceladoEm = agora;
      }
      cur.historico = cur.historico || {};
      cur.historico[novaChave()] = { status: novo, em: agora, por: "operacao" };
      return cur;
    }, { applyLocally: false });
    const ok = tx.committed && tx.snapshot.val()?.status === novo;
    return { ok, atual: atual || tx.snapshot.val()?.status || null, dados: tx.snapshot.val() };
  }

  function avisoConflito(s, atual) {
    const quem = rotuloMesa(s);
    if (atual === STATUS.CANCELADO) toast(`${quem} cancelou este pedido antes do atendimento.`);
    else if (!atual) toast("Este pedido não existe mais.");
    else toast(`Este pedido da ${quem} já está como ${ROTULO[atual] || atual}.`);
  }

  async function executar(id, fn) {
    if (S.ocupados.has(id)) return;
    if (!S.conectado) { toast("Sem conexão com o banco. Aguarde reconectar."); return; }
    S.ocupados.add(id); agendarRender();
    try { await fn(); }
    catch (e) { console.warn(e); toast("Não foi possível salvar agora. Tente de novo."); }
    finally { S.ocupados.delete(id); agendarRender(); }
  }

  function atender(id, silencioso = false) {
    return executar(id, async () => {
      const s = S.sol[id];
      const res = await mudarStatus(id, [STATUS.SOLICITADO], STATUS.EM_ATENDIMENTO);
      if (!res.ok) { avisoConflito(s, res.atual); return; }
      if (!silencioso) toast(`${rotuloMesa(s)}: atendimento de ${nomeDe(s)} iniciado.`, "Desfazer", () => desfazerAtender(id));
    });
  }
  function desfazerAtender(id) {
    return executar(id, async () => {
      const res = await mudarStatus(id, [STATUS.EM_ATENDIMENTO], STATUS.SOLICITADO);
      if (!res.ok) toast("Não foi possível desfazer: o status já mudou.");
    });
  }
  function concluir(id, silencioso = false) {
    return executar(id, async () => {
      const s = S.sol[id];
      const res = await mudarStatus(id, [STATUS.EM_ATENDIMENTO], STATUS.ATENDIDO);
      if (!res.ok) { avisoConflito(s, res.atual); return; }
      if (res.dados?.controlaEstoque) await consumirReserva(res.dados.produtoId, id);
      if (!silencioso) toast(`✓ ${rotuloMesa(s)} atendida: ${nomeDe(s)}, ${qtdTexto(s.quantidade, catDe(s))}.`);
    });
  }
  function cancelarAdm(id) {
    return executar(id, async () => {
      const s = S.sol[id];
      const res = await mudarStatus(id, ATIVOS, STATUS.CANCELADO);
      if (!res.ok) { avisoConflito(s, res.atual); return; }
      if (res.dados?.controlaEstoque) await liberarEstoque(res.dados.produtoId, id);
      toast(`Pedido da ${rotuloMesa(s)} cancelado. A mesa já foi avisada.`);
    });
  }
  async function emLote(ids, fn) {
    for (const id of ids) await fn(id, true);
  }

  /* ============================================================================
     8) MANUTENÇÃO AUTOMÁTICA (sem simulação: apenas mantém o estado coerente)
     ============================================================================ */
  function agendarReposicoes() {
    for (const p of PIZZAS) {
      clearTimeout(S.timers[p.id]);
      const e = S.estoque[p.id];
      if (!e || (Number(e.disponivel) || 0) > 0) continue;
      const falta = e.zeradoEm ? e.zeradoEm + REPOSICAO_MS - agoraServidor() : 0;
      S.timers[p.id] = setTimeout(() => reporPizza(p.id), Math.max(0, falta) + 250);
    }
  }

  /* Coerência: fila/reserva órfã de pedido cancelado, reserva de pedido atendido,
     e pedidos aguardando que já receberam reserva. */
  function reconciliar() {
    if (!S.conectado || !S.estoqueCarregado || !S.solCarregadas) return;
    for (const s of Object.values(S.sol)) {
      if (!s?.controlaEstoque) continue;
      const e = S.estoque[s.produtoId];
      if (!e) continue;
      const temReserva = !!e.reservas?.[s.id], naFila = !!e.fila?.[s.id];
      if (s.status === STATUS.AGUARDANDO_REPOSICAO && temReserva) promoverSolicitacao(s.id);
      else if (s.status === STATUS.CANCELADO && (temReserva || naFila)) umaVez("lib:" + s.id, () => liberarEstoque(s.produtoId, s.id));
      else if (s.status === STATUS.ATENDIDO && temReserva) umaVez("cons:" + s.id, () => consumirReserva(s.produtoId, s.id));
    }
  }
  function umaVez(chave, fn) {
    if (S.emAndamento.has(chave)) return;
    S.emAndamento.add(chave);
    Promise.resolve().then(fn).catch(e => console.warn(e)).finally(() => S.emAndamento.delete(chave));
  }

  /* Registra no log interno quando uma pizza esgota ou é reposta (chave determinística). */
  function registrarEventosEstoque() {
    if (!S.conectado || !S.eventosCarregados) return;
    for (const p of PIZZAS) {
      const e = S.estoque[p.id];
      if (!e) continue;
      if ((Number(e.disponivel) || 0) === 0 && e.zeradoEm) {
        garantirEvento(`${p.id}_esg_${e.zeradoEm}`, { tipo: "esgotada", produtoId: p.id, produtoNome: p.nome, ciclo: e.ciclo || 1, em: e.zeradoEm });
      }
      if ((e.ciclo || 1) > 1 && e.repostoEm) {
        garantirEvento(`${p.id}_rep_${e.ciclo}`, { tipo: "reposta", produtoId: p.id, produtoNome: p.nome, ciclo: e.ciclo, em: e.repostoEm, manual: e.reposicaoManualEm === e.repostoEm });
      }
    }
  }
  function garantirEvento(chave, dados) {
    if (S.eventos[chave] || S.emAndamento.has("ev:" + chave)) return;
    S.emAndamento.add("ev:" + chave);
    runTransaction(r(`eventosEstoque/${chave}`), cur => cur === null ? dados : undefined, { applyLocally: false })
      .catch(e => console.warn(e))
      .finally(() => S.emAndamento.delete("ev:" + chave));
  }

  /* Cria catálogo e estoque inicial se o banco estiver vazio (idêntico ao cliente). */
  let catalogoOk = false;
  async function garantirCatalogo() {
    if (catalogoOk || !S.conectado) return;
    catalogoOk = true;
    try {
      const cfg = await get(r("config/versaoCatalogo"));
      if (cfg.val() !== VERSAO_CATALOGO) {
        const u = {};
        u["config/versaoCatalogo"] = VERSAO_CATALOGO;
        u["config/fatiasPorPizza"] = FATIAS_POR_PIZZA;
        u["config/reposicaoMs"] = REPOSICAO_MS;
        u["config/totalMesas"] = TOTAL_MESAS;
        for (const c of CATEGORIAS) u[`categorias/${c.id}`] = { id: c.id, nome: c.nome, emoji: c.emoji, ordem: c.ordem, controlaEstoque: c.controlaEstoque, unidade: c.unidade.id };
        for (const p of PRODUTOS) u[`produtos/${p.id}`] = { id: p.id, nome: p.nome, categoria: p.categoria, ordem: p.ordem, controlaEstoque: p.controlaEstoque, emoji: p.emoji };
        for (let n = 1; n <= TOTAL_MESAS; n++) { u[`mesas/${mesaIdDe(n)}/numero`] = n; u[`mesas/${mesaIdDe(n)}/rotulo`] = `Mesa ${doisDig(n)}`; }
        await update(ref(db, RAIZ), u);
      }
      const est = await get(r("estoque"));
      const atual = est.val() || {};
      await Promise.all(PIZZAS.filter(p => !atual[p.id]).map(p =>
        runTransaction(r(`estoque/${p.id}`), (cur) => cur === null ? {
          produtoId: p.id, capacidade: FATIAS_POR_PIZZA, disponivel: FATIAS_POR_PIZZA, ciclo: 1, atualizadoEm: agoraServidor()
        } : undefined, { applyLocally: false })
      ));
    } catch (e) { catalogoOk = false; console.warn("[catálogo]", e); }
  }

  /* ============================================================================
     9) LISTENERS EM TEMPO REAL
     ============================================================================ */
  function ouvir() {
    onValue(ref(db, ".info/serverTimeOffset"), s => { S.offset = Number(s.val()) || 0; });
    onValue(ref(db, ".info/connected"), s => {
      S.conectado = s.val() === true;
      if (S.conectado) { S.jaConectou = true; garantirCatalogo(); agendarReposicoes(); reconciliar(); registrarEventosEstoque(); }
      atualizarConexao(); agendarRender();
    });
    onValue(r("estoque"), s => {
      S.estoque = s.val() || {};
      S.estoqueCarregado = true;
      agendarReposicoes(); reconciliar(); registrarEventosEstoque(); agendarRender();
    }, erro);
    onValue(r("solicitacoes"), s => {
      const novas = {};
      s.forEach(c => { const v = c.val(); if (v) novas[c.key] = { ...v, id: c.key }; });
      detectarNovidades(novas);
      S.sol = novas;
      S.solCarregadas = true;
      reconciliar(); agendarRender();
    }, erro);
    onValue(r("mesas"), s => { S.mesas = s.val() || {}; agendarRender(); if (S.mesaAberta) renderMesaAberta(); }, erro);
    onValue(query(r("eventosEstoque"), orderByChild("em"), limitToLast(120)), s => {
      const ev = {};
      s.forEach(c => { ev[c.key] = c.val(); });
      S.eventos = ev; S.eventosCarregados = true;
      registrarEventosEstoque(); agendarRender();
    }, erro);
  }
  function erro(e) { console.warn("[firebase]", e); }

  /* Alertas de chegada para o garçom */
  function detectarNovidades(novas) {
    if (!S.solCarregadas) {
      S.statusVisto = Object.fromEntries(Object.entries(novas).map(([k, v]) => [k, v.status]));
      return;
    }
    let tocar = false;
    for (const [id, s] of Object.entries(novas)) {
      const antes = S.statusVisto[id];
      const q = qtdTexto(s.quantidade, catDe(s));
      if (!antes && s.status === STATUS.SOLICITADO) {
        S.novos.set(id, Date.now()); tocar = true;
        toast(`${rotuloMesa(s)} pediu ${nomeDe(s)}: ${q}.`);
      } else if (!antes && s.status === STATUS.AGUARDANDO_REPOSICAO) {
        toast(`${rotuloMesa(s)} reservou ${q} da próxima ${nomeDe(s)}.`);
      } else if (antes === STATUS.AGUARDANDO_REPOSICAO && s.status === STATUS.SOLICITADO) {
        S.novos.set(id, Date.now()); tocar = true;
        toast(`🔥 ${nomeDe(s)} saiu: levar ${q} para a ${rotuloMesa(s)}.`);
      } else if (antes && antes !== STATUS.CANCELADO && s.status === STATUS.CANCELADO && s.canceladoPor === "cliente") {
        toast(`${rotuloMesa(s)} cancelou ${nomeDe(s)}.`);
      }
    }
    S.statusVisto = Object.fromEntries(Object.entries(novas).map(([k, v]) => [k, v.status]));
    if (tocar) bip();
  }

  /* ============================================================================
     10) RENDERIZAÇÃO
     ============================================================================ */
  let renderPendente = false;
  function agendarRender() {
    if (renderPendente) return;
    renderPendente = true;
    requestAnimationFrame(() => {
      renderPendente = false;
      if (S.modo === "garcom") renderGarcom(); else renderGestao();
      atualizarBadge();
      if (!$("#telaDemo").hidden) renderDemoConexao();
    });
  }
  function atualizarConexao() {
    const el = $("#conexao");
    el.dataset.estado = S.conectado ? "on" : "off";
    el.lastElementChild.textContent = S.conectado ? "Conectado" : (S.jaConectou ? "Reconectando..." : "Conectando...");
  }
  function atualizarBadge() {
    const n = Object.values(S.sol).filter(s => s.status === STATUS.SOLICITADO).length;
    const b = $("#badgeGarcom"); b.hidden = n === 0; b.textContent = n;
    document.title = n ? `(${n}) Operação | Rodízio` : "Operação | Rodízio";
  }

  function estadoPizza(id) {
    const e = S.estoque[id];
    if (!e) return null;
    const cap = Number(e.capacidade) || FATIAS_POR_PIZZA;
    const disp = Math.max(0, Math.min(cap, Number(e.disponivel) || 0));
    const ciclo = e.ciclo || 1;
    const reservadas = Object.values(e.reservas || {}).filter(x => (x?.ciclo || 1) === ciclo).reduce((t, x) => t + (Number(x?.quantidade) || 0), 0);
    const fila = e.fila || {};
    const recente = disp > 0 && ciclo > 1 && e.repostoEm && agoraServidor() - e.repostoEm < DESTAQUE_REPOSTA_MS;
    return {
      cap, disp, ciclo, reservadas: Math.min(reservadas, cap - disp),
      esgotada: disp === 0, poucas: disp > 0 && disp <= POUCAS_FATIAS, recente,
      repostoEm: e.repostoEm || null, zeradoEm: e.zeradoEm || null,
      filaQtd: somaFila(fila), filaMesas: new Set(Object.values(fila).map(f => f?.mesaId)).size
    };
  }
  function tagEstoque(id) {
    const st = estadoPizza(id);
    if (!st) return "";
    if (st.esgotada) return `<span class="tag esg">ESGOTADA</span>`;
    if (st.recente) return `<span class="tag fogo">🔥 REPOSTA AGORA</span>`;
    if (st.poucas) return `<span class="tag pouca">${st.disp === 1 ? "1 FATIA LIVRE" : st.disp + " FATIAS LIVRES"}</span>`;
    return `<span class="tag livre num">${st.disp} LIVRES</span>`;
  }

  /* ---------------- MODO GARÇOM ---------------- */
  function passaFiltro(s) { return S.filtro === "todas" || catDe(s) === S.filtro; }

  function montarFiltros() {
    const ops = [["todas", "Tudo"], ...CATEGORIAS.map(c => [c.id, `${c.emoji} ${c.nome}`])];
    $("#filtros").innerHTML = ops.map(([id, nome]) => `<button class="filtro" type="button" data-filtro="${id}" aria-pressed="${S.filtro === id}">${esc(nome)}</button>`).join("");
  }

  function htmlTicket(s, extraPrio = false) {
    const p = PRODUTO[s.produtoId];
    const c = catDe(s);
    const ocupado = S.ocupados.has(s.id);
    const esp = espera(s.status === STATUS.EM_ATENDIMENTO ? (s.atendimentoIniciadoEm || s.criadoEm) : (s.liberadoEm || s.criadoEm));
    const novo = S.novos.has(s.id) && Date.now() - S.novos.get(s.id) < 8000;
    let acao = "";
    if (s.status === STATUS.SOLICITADO) acao = `<button class="acao" type="button" data-acao="atender" data-id="${s.id}" ${ocupado ? "disabled" : ""}>${ocupado ? "SALVANDO…" : "ATENDER"}</button>`;
    else if (s.status === STATUS.EM_ATENDIMENTO) acao = `<button class="acao concluir" type="button" data-acao="concluir" data-id="${s.id}" ${ocupado ? "disabled" : ""}>${ocupado ? "SALVANDO…" : "CONCLUIR ATENDIMENTO"}</button>`;
    const conf = S.confirmandoCancel === s.id;
    const cancelar = ATIVOS.includes(s.status)
      ? `<button class="cancelar-adm${conf ? " confirmar" : ""}" type="button" data-acao="cancelar" data-id="${s.id}" ${ocupado ? "disabled" : ""}>${conf ? "Confirmar cancelamento" : "Cancelar"}</button>` : "";
    const prio = (extraPrio || s.prioridade) && s.status === STATUS.SOLICITADO;
    return `<article class="ticket st-${s.status}${prio ? " prioridade" : ""}${novo ? " novo" : ""}">
      <div class="ticket-mesa"><small>MESA</small><b class="num">${doisDig(numeroMesa(s))}</b></div>
      <div class="ticket-corpo">
        <div class="ticket-topo"><span>${esc(emojiDe(s))} ${esc(CAT[c]?.item || "")}</span><span class="espera ${esp.nivel}">${esp.txt}</span></div>
        ${prio ? `<div class="ticket-prio">🔥 PRIORIDADE: acabou de sair, levar primeiro</div>` : ""}
        <h3>${esc(nomeDe(s))}</h3>
        <div class="ticket-qtd num">${esc(qtdTexto(s.quantidade, c).toUpperCase())}</div>
        <div><span class="chip st-${s.status}">${ROTULO[s.status] || s.status}</span></div>
        <div class="ticket-acoes">${acao}${cancelar}</div>
      </div>
    </article>`;
  }

  function renderGarcom() {
    const ativos = Object.values(S.sol).filter(s => ATIVOS.includes(s.status) && passaFiltro(s));
    const prioSol = ativos.filter(s => s.status === STATUS.SOLICITADO && s.prioridade).sort((a, b) => (a.liberadoEm || a.criadoEm || 0) - (b.liberadoEm || b.criadoEm || 0));
    const aguardando = ativos.filter(s => s.status === STATUS.AGUARDANDO_REPOSICAO).sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
    const aAtender = ativos.filter(s => s.status === STATUS.SOLICITADO && !s.prioridade).sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
    const emAt = ativos.filter(s => s.status === STATUS.EM_ATENDIMENTO).sort((a, b) => (a.atendimentoIniciadoEm || 0) - (b.atendimentoIniciadoEm || 0));

    $("#resSol").textContent = prioSol.length + aAtender.length;
    $("#resEm").textContent = emAt.length;
    $("#resAgu").textContent = aguardando.length;

    let html = "";
    if (!S.solCarregadas) html = `<div class="vazio"><strong>Carregando solicitações…</strong></div>`;
    else if (S.visao === "pedido") html = htmlPorPedido(prioSol, aguardando, aAtender, emAt);
    else html = htmlPorProduto(ativos);

    const el = $("#garcomConteudo");
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
  }

  function htmlAguardando(aguardando) {
    if (!aguardando.length) return "";
    const grupos = {};
    aguardando.forEach(s => { (grupos[s.produtoId] ||= []).push(s); });
    return `<div class="aguarda">${Object.entries(grupos).map(([pid, lista]) => `
      <div class="ag-grupo">
        <div class="ag-cab"><span>${esc(emojiDe(lista[0]))} ${esc(nomeDe(lista[0]))}</span>${tagEstoque(pid)}</div>
        ${lista.map(s => {
          const conf = S.confirmandoCancel === s.id;
          return `<div class="ag-linha"><b class="num">${rotuloMesa(s)}</b><span class="seta">→</span><strong>${esc(qtdTexto(s.quantidade, catDe(s)))}</strong>
          <span class="dir"><span class="chip st-AGUARDANDO_REPOSICAO">AGUARDANDO REPOSIÇÃO</span>
          <button class="cancelar-adm${conf ? " confirmar" : ""}" type="button" data-acao="cancelar" data-id="${s.id}">${conf ? "Confirmar" : "Cancelar"}</button></span></div>`;
        }).join("")}
      </div>`).join("")}</div>`;
  }

  function htmlPorPedido(prioSol, aguardando, aAtender, emAt) {
    let h = "";
    if (prioSol.length || aguardando.length) {
      h += `<section class="bloco prio"><div class="bloco-cab"><h2>🔥 Prioridade</h2><span class="cont num">${prioSol.length + aguardando.length}</span></div>
        ${prioSol.length ? `<div class="tickets">${prioSol.map(s => htmlTicket(s, true)).join("")}</div>` : ""}
        ${htmlAguardando(aguardando)}
      </section>`;
    }
    h += `<section class="bloco"><div class="bloco-cab"><h2>A atender</h2><span class="cont num">${aAtender.length}</span></div>
      ${aAtender.length ? `<div class="tickets">${aAtender.map(s => htmlTicket(s)).join("")}</div>`
        : `<div class="vazio"><strong>Nenhuma mesa aguardando atendimento.</strong>As novas solicitações aparecem aqui automaticamente.</div>`}
    </section>`;
    if (emAt.length) {
      h += `<section class="bloco"><div class="bloco-cab"><h2>Em atendimento</h2><span class="cont num">${emAt.length}</span></div>
        <div class="tickets">${emAt.map(s => htmlTicket(s)).join("")}</div></section>`;
    }
    const recentes = Object.values(S.sol).filter(s => s.status === STATUS.ATENDIDO && passaFiltro(s))
      .sort((a, b) => (b.atendidoEm || b.atualizadoEm || 0) - (a.atendidoEm || a.atualizadoEm || 0)).slice(0, 8);
    if (recentes.length) {
      h += `<section class="bloco"><div class="bloco-cab"><h2>Atendidos recentemente</h2></div>
        <ul class="recentes">${recentes.map(s => `<li><span class="hora num">${hora(s.atendidoEm || s.atualizadoEm)}</span><b>${rotuloMesa(s)}</b><span>${esc(emojiDe(s))} ${esc(nomeDe(s))}, ${esc(qtdTexto(s.quantidade, catDe(s)))}</span></li>`).join("")}</ul>
      </section>`;
    }
    return h;
  }

  function htmlPorProduto(ativos) {
    if (!ativos.length) return `<div class="vazio"><strong>Nenhuma solicitação em aberto.</strong>Quando as mesas pedirem, os produtos aparecem agrupados aqui.</div>`;
    const grupos = {};
    ativos.forEach(s => { (grupos[s.produtoId] ||= []).push(s); });
    const ordem = Object.entries(grupos).map(([pid, lista]) => {
      const prio = lista.some(s => s.status === STATUS.SOLICITADO && s.prioridade);
      const maisAntigo = Math.min(...lista.map(s => s.criadoEm || Infinity));
      return { pid, lista, prio, maisAntigo };
    }).sort((a, b) => (b.prio - a.prio) || (a.maisAntigo - b.maisAntigo));

    const pesoStatus = { SOLICITADO: 0, EM_ATENDIMENTO: 1, AGUARDANDO_REPOSICAO: 2 };
    return `<div class="grupos">${ordem.map(({ pid, lista, prio }) => {
      lista.sort((a, b) => (pesoStatus[a.status] - pesoStatus[b.status]) || ((b.prioridade ? 1 : 0) - (a.prioridade ? 1 : 0)) || ((a.criadoEm || 0) - (b.criadoEm || 0)));
      const c = catDe(lista[0]);
      const total = lista.reduce((t, s) => t + (Number(s.quantidade) || 0), 0);
      const mesas = new Set(lista.map(s => s.mesaId)).size;
      const paraAtender = lista.filter(s => s.status === STATUS.SOLICITADO).map(s => s.id);
      const paraConcluir = lista.filter(s => s.status === STATUS.EM_ATENDIMENTO).map(s => s.id);
      return `<article class="grupo${prio ? " tem-prio" : ""}">
        <div class="grupo-cab">
          <div><h3>${esc(emojiDe(lista[0]))} ${esc(nomeDe(lista[0]))}</h3>
            <div class="grupo-total num">${esc(qtdTexto(total, c).toUpperCase())} <span>— ${mesas} ${mesas === 1 ? "MESA" : "MESAS"}</span></div></div>
          ${PRODUTO[pid]?.controlaEstoque ? tagEstoque(pid) : ""}
        </div>
        <ul>${lista.map(s => {
          const oc = S.ocupados.has(s.id);
          let btn = "";
          if (s.status === STATUS.SOLICITADO) btn = `<button class="mini" type="button" data-acao="atender" data-id="${s.id}" ${oc ? "disabled" : ""}>ATENDER</button>`;
          else if (s.status === STATUS.EM_ATENDIMENTO) btn = `<button class="mini concluir" type="button" data-acao="concluir" data-id="${s.id}" ${oc ? "disabled" : ""}>CONCLUIR</button>`;
          const esp = espera(s.liberadoEm || s.criadoEm);
          return `<li class="linha-g"><span class="mesa-g num">${rotuloMesa(s)}</span><span>→</span><span class="qtd-g">${esc(qtdTexto(s.quantidade, c))}</span>
            ${s.prioridade && s.status === STATUS.SOLICITADO ? `<span class="tag fogo">🔥 PRIORIDADE</span>` : ""}
            <span class="dir"><span class="espera ${esp.nivel}" style="font-size:12px">${esp.txt}</span><span class="chip st-${s.status}">${ROTULO[s.status]}</span>${btn}</span></li>`;
        }).join("")}</ul>
        ${paraAtender.length || paraConcluir.length ? `<div class="grupo-rodape">
          ${paraAtender.length > 1 ? `<button class="acao" type="button" data-acao="atender-todas" data-ids="${paraAtender.join(",")}">ATENDER TODAS (${paraAtender.length})</button>` : ""}
          ${paraConcluir.length > 1 ? `<button class="acao concluir" type="button" data-acao="concluir-todas" data-ids="${paraConcluir.join(",")}">CONCLUIR TODAS (${paraConcluir.length})</button>` : ""}
        </div>` : ""}
      </article>`;
    }).join("")}</div>`;
  }

  /* ---------------- MODO COZINHA / GESTÃO ---------------- */
  function renderGestao() {
    const todas = Object.values(S.sol);
    const validas = todas.filter(s => s.status !== STATUS.CANCELADO);
    const cont = (st) => todas.filter(s => s.status === st).length;
    const pend = cont(STATUS.SOLICITADO) + cont(STATUS.AGUARDANDO_REPOSICAO);
    const atendidas = todas.filter(s => s.status === STATUS.ATENDIDO);
    const fatiasServidas = atendidas.filter(s => s.controlaEstoque).reduce((t, s) => t + (Number(s.consumo?.quantidade ?? s.quantidade) || 0), 0);
    const estados = PIZZAS.map(p => ({ p, st: estadoPizza(p.id) })).filter(x => x.st);
    const esgotadas = estados.filter(x => x.st.esgotada);

    $("#kpis").innerHTML = [
      ["Solicitações", todas.length, cont(STATUS.CANCELADO) === 1 ? "1 cancelada" : `${cont(STATUS.CANCELADO)} canceladas`, false],
      ["Pendentes", pend, `${cont(STATUS.AGUARDANDO_REPOSICAO)} aguardando reposição`, false],
      ["Em atendimento", cont(STATUS.EM_ATENDIMENTO), "com o garçom agora", false],
      ["Atendidas", atendidas.length, fatiasServidas === 1 ? "1 fatia servida" : `${fatiasServidas} fatias servidas`, false],
      ["Pizzas esgotadas", esgotadas.length, `de ${PIZZAS.length} sabores`, esgotadas.length > 0]
    ].map(([t, v, sub, al]) => `<div class="kpi${al ? " alerta" : ""}"><h3>${t}</h3><b class="num">${v}</b><small>${esc(sub)}</small></div>`).join("");

    // Tiles das pizzas
    const tile = ({ p, st }) => {
      let cls = "tile", tag = "";
      if (st.esgotada) { cls += " esgotada"; tag = `<span class="tag esg" style="background:#fff;color:#2B2F2C">ESGOTADA</span>`; }
      else if (st.recente) { cls += " reposta"; tag = `<span class="tag fogo">🔥 REPOSTA AGORA</span>`; }
      else if (st.poucas) { cls += " poucas"; tag = `<span class="tag pouca">POUCAS FATIAS</span>`; }
      const seg = Array.from({ length: st.cap }, (_, i) => `<i class="${i < st.disp ? "l" : i < st.disp + st.reservadas ? "r" : ""}"></i>`).join("");
      const extra = st.esgotada && st.filaMesas ? `<span style="font-size:12px;font-weight:700">${st.filaMesas} ${st.filaMesas === 1 ? "mesa aguardando" : "mesas aguardando"}</span>` : "";
      return `<div class="${cls}"><div class="tile-nome">${esc(p.nome)}</div>
        <div class="tile-num"><b class="num">${st.disp}</b><span>de ${st.cap} livres${st.reservadas ? `, ${st.reservadas} reservadas` : ""}</span></div>
        <div class="fatias" aria-hidden="true">${seg}</div>${tag}${extra}</div>`;
    };
    $("#tilesSalgadas").innerHTML = estados.filter(x => x.p.categoria === "salgadas").map(tile).join("") || `<p class="lista-vazia">Carregando…</p>`;
    $("#tilesDoces").innerHTML = estados.filter(x => x.p.categoria === "doces").map(tile).join("") || `<p class="lista-vazia">Carregando…</p>`;
    const livresTot = estados.reduce((t, x) => t + x.st.disp, 0);
    $("#pizzasResumo").textContent = estados.length ? `${livresTot} fatias livres no total` : "";

    // Listas laterais
    $("#listaEsgotadas").innerHTML = esgotadas.length
      ? esgotadas.map(({ p, st }) => `<li>${p.emoji} ${esc(p.nome)}<span class="dir">${st.filaMesas ? `${st.filaQtd} fatias <small>(${st.filaMesas} ${st.filaMesas === 1 ? "mesa" : "mesas"} aguardando)</small>` : `<small>sem fila</small>`}</span></li>`).join("")
      : `<li class="lista-vazia">Nenhuma pizza esgotada.</li>`;
    const poucas = estados.filter(x => x.st.poucas).sort((a, b) => a.st.disp - b.st.disp);
    $("#listaPoucas").innerHTML = poucas.length
      ? poucas.map(({ p, st }) => `<li>${p.emoji} ${esc(p.nome)}<span class="dir num">${st.disp} ${st.disp === 1 ? "fatia" : "fatias"}</span></li>`).join("")
      : `<li class="lista-vazia">Nenhuma pizza com poucas fatias.</li>`;
    const agora = agoraServidor();
    const repostas = estados.filter(x => x.st.ciclo > 1 && x.st.repostoEm && agora - x.st.repostoEm < RECENTE_GESTAO_MS).sort((a, b) => b.st.repostoEm - a.st.repostoEm);
    $("#listaRepostas").innerHTML = repostas.length
      ? repostas.map(({ p, st }) => `<li>${p.emoji} ${esc(p.nome)}<span class="dir num"><small>${hora(st.repostoEm)}</small></span></li>`).join("")
      : `<li class="lista-vazia">Nenhuma reposição nos últimos minutos.</li>`;

    // Mais solicitados (somente solicitações reais, exceto canceladas)
    const porProd = {};
    validas.forEach(s => { const x = (porProd[s.produtoId] ||= { s, pedidos: 0, qtd: 0 }); x.pedidos++; x.qtd += Number(s.quantidade) || 0; });
    const top = Object.values(porProd).sort((a, b) => b.pedidos - a.pedidos || b.qtd - a.qtd).slice(0, 8);
    const maxP = Math.max(1, ...top.map(t => t.pedidos));
    $("#maisSolicitados").innerHTML = top.length
      ? top.map(t => `<div class="barra-h"><span class="rot">${esc(emojiDe(t.s))} ${esc(nomeDe(t.s))}</span><span class="val num">${t.pedidos} ${t.pedidos === 1 ? "pedido" : "pedidos"} <small>(${esc(qtdTexto(t.qtd, catDe(t.s)))})</small></span><span class="trilho"><i style="width:${(t.pedidos / maxP) * 100}%"></i></span></div>`).join("")
      : `<p class="lista-vazia">Ainda não há solicitações. Os dados aparecem conforme as mesas pedem.</p>`;

    // Demanda por categoria
    const porCat = Object.fromEntries(CATEGORIAS.map(c => [c.id, { pedidos: 0, qtd: 0 }]));
    validas.forEach(s => { const x = porCat[catDe(s)]; if (x) { x.pedidos++; x.qtd += Number(s.quantidade) || 0; } });
    const maxC = Math.max(1, ...Object.values(porCat).map(x => x.pedidos));
    $("#porCategoria").innerHTML = CATEGORIAS.map(c => {
      const x = porCat[c.id];
      return `<div class="barra-h cat"><span class="rot">${c.emoji} ${c.nome}</span><span class="val num">${x.pedidos} ${x.pedidos === 1 ? "pedido" : "pedidos"} <small>(${esc(qtdTexto(x.qtd, c.id))})</small></span><span class="trilho"><i style="width:${(x.pedidos / maxC) * 100}%"></i></span></div>`;
    }).join("");

    renderMesas();
    renderFeed();
  }

  function renderMesas() {
    const ativosPorMesa = {};
    Object.values(S.sol).forEach(s => { if (ATIVOS.includes(s.status)) ativosPorMesa[s.mesaId] = (ativosPorMesa[s.mesaId] || 0) + 1; });
    $("#mesasGrid").innerHTML = Array.from({ length: TOTAL_MESAS }, (_, i) => {
      const id = mesaIdDe(i + 1);
      const disp = Object.keys(S.mesas[id]?.dispositivos || {}).length;
      const at = ativosPorMesa[id] || 0;
      return `<button class="mesa-c${disp ? " online" : ""}${at ? " ativa" : ""}" type="button" data-mesa="${id}">
        <b class="num">${doisDig(i + 1)}</b>
        <span><i class="on"></i>${disp ? "conectada" : "sem aparelho"}</span>
        <span>${at ? `${at} em aberto` : "sem pedidos"}</span></button>`;
    }).join("");
  }

  /* Atividade da equipe: histórico das solicitações + eventos de estoque */
  function eventosAtividade() {
    const ev = [];
    for (const s of Object.values(S.sol)) {
      const hist = Object.values(s.historico || {}).filter(h => h && h.em);
      if (!hist.length) ev.push({ em: s.criadoEm || 0, status: s.status, por: "cliente", s });
      hist.forEach(h => ev.push({ em: h.em, status: h.status, por: h.por, s }));
    }
    for (const e of Object.values(S.eventos)) if (e?.em) ev.push({ em: e.em, estoque: e });
    return ev.sort((a, b) => b.em - a.em || (a.estoque ? 1 : 0) - (b.estoque ? 1 : 0)).slice(0, 80);
  }
  function textoEvento(ev) {
    if (ev.estoque) {
      const e = ev.estoque;
      const nome = e.produtoNome || PRODUTO[e.produtoId]?.nome || "";
      if (e.tipo === "esgotada") return ["⛔", `${nome} ficou esgotada.`];
      return ["🔥", `${nome} foi reposta${e.manual ? " (reposição manual)" : ""}.`];
    }
    const s = ev.s, m = rotuloMesa(s), n = nomeDe(s), q = qtdTexto(s.quantidade, catDe(s));
    switch (ev.status) {
      case STATUS.SOLICITADO:
        if (ev.por === "sistema") return ["🔥", `Prioridade: ${q} de ${n} destinadas à ${m}.`];
        if (ev.por === "operacao") return ["↩️", `Atendimento da ${m} (${n}) voltou para a fila.`];
        return ["🛎️", `${m} solicitou ${n} — ${q}.`];
      case STATUS.AGUARDANDO_REPOSICAO: return ["⏳", `${m} reservou ${n} da próxima pizza — ${q}.`];
      case STATUS.EM_ATENDIMENTO: return ["🏃", `Atendimento iniciado: ${m}, ${n}.`];
      case STATUS.ATENDIDO: return ["✅", `${m} foi atendida — ${n}, ${q}.`];
      case STATUS.CANCELADO: return ["✖️", ev.por === "cliente" ? `${m} cancelou ${n}.` : `Equipe cancelou o pedido da ${m} — ${n}.`];
      default: return ["•", `${m}: ${n}.`];
    }
  }
  function renderFeed() {
    const ev = eventosAtividade();
    const html = ev.length
      ? ev.map(e => { const [ic, t] = textoEvento(e); return `<li><span class="hora num">${hora(e.em)}</span><span aria-hidden="true">${ic}</span><span>${esc(t)}</span></li>`; }).join("")
      : `<li class="lista-vazia" style="display:block">Nenhuma atividade ainda. Tudo o que acontecer no rodízio aparece aqui.</li>`;
    const el = $("#feed");
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
  }

  /* ---------------- Mesa (detalhe) ---------------- */
  function abrirMesa(mesaId) { S.mesaAberta = mesaId; renderMesaAberta(); abrir("telaMesa"); }
  function renderMesaAberta() {
    const id = S.mesaAberta; if (!id) return;
    const n = Number(id.replace(/\D/g, ""));
    const m = S.mesas[id] || {};
    const disp = Object.keys(m.dispositivos || {}).length;
    const inicio = Number(m.inicioAtendimento) || 0;
    const pedidos = Object.values(S.sol).filter(s => s.mesaId === id && (ATIVOS.includes(s.status) || (s.criadoEm || 0) >= inicio))
      .sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
    $("#mesaTitulo").textContent = `Mesa ${doisDig(n)}`;
    $("#mesaInfo").textContent = `${disp ? `${disp} ${disp === 1 ? "aparelho conectado" : "aparelhos conectados"}` : "Nenhum aparelho conectado"}${inicio ? `. Atendimento atual desde ${hora(inicio)}.` : "."}`;
    $("#mesaPedidos").innerHTML = pedidos.length
      ? pedidos.map(s => `<li><span>${esc(emojiDe(s))} ${esc(nomeDe(s))}, ${esc(qtdTexto(s.quantidade, catDe(s)))}</span><span class="dir"><span class="chip st-${s.status}">${ROTULO[s.status]}</span></span></li>`).join("")
      : `<li class="lista-vazia">Nenhum pedido no atendimento atual.</li>`;
  }
  async function liberarMesa(mesaId) {
    const ativos = Object.values(S.sol).filter(s => s.mesaId === mesaId && ATIVOS.includes(s.status)).length;
    const n = doisDig(Number(mesaId.replace(/\D/g, "")));
    const ok = await confirmar({
      titulo: `Liberar Mesa ${n}?`,
      texto: (ativos ? `Atenção: a mesa ainda tem ${ativos} ${ativos === 1 ? "pedido" : "pedidos"} em aberto, que continuarão no painel. ` : "") +
        "Os aparelhos da mesa passam a mostrar uma lista de pedidos vazia e as preferências \"Não recomendar\" da mesa serão apagadas.",
      botao: "Liberar mesa"
    });
    if (!ok) return;
    try {
      await update(ref(db, RAIZ), { [`mesas/${mesaId}/inicioAtendimento`]: serverTimestamp(), [`preferencias/${mesaId}`]: null });
      toast(`Mesa ${n} liberada para novos clientes.`);
      fechar("telaMesa");
    } catch (e) { console.warn(e); toast("Não foi possível liberar a mesa agora."); }
  }

  /* ============================================================================
     11) ÁREA DE DEMONSTRAÇÃO
     ============================================================================ */
  function montarDemo() {
    const og = (cat) => `<optgroup label="${CAT[cat].nome}">${PIZZAS.filter(p => p.categoria === cat).map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join("")}</optgroup>`;
    $("#demoPizza").innerHTML = og("salgadas") + og("doces");
  }
  function renderDemoConexao() {
    let aparelhos = 0; const mesasOn = [];
    for (const [id, m] of Object.entries(S.mesas)) {
      const n = Object.keys(m?.dispositivos || {}).length;
      if (n) { aparelhos += n; mesasOn.push(id.replace("mesa_", "")); }
    }
    $("#demoConexao").innerHTML = `${S.conectado ? "🟢 Conectado ao banco em tempo real." : "🟠 Sem conexão no momento, tentando reconectar."}<br>
      Aparelhos de clientes conectados: <b>${aparelhos}</b>${mesasOn.length ? ` (mesas ${mesasOn.sort().join(", ")})` : ""}.<br>
      Solicitações no banco: <b>${Object.keys(S.sol).length}</b>.`;
  }
  function estoqueZerado(ciclo) {
    return { capacidade: FATIAS_POR_PIZZA, disponivel: FATIAS_POR_PIZZA, ciclo, atualizadoEm: agoraServidor() };
  }
  async function limparPedidos() {
    const ok = await confirmar({
      titulo: "Limpar pedidos de teste?",
      texto: "Todas as solicitações serão apagadas em todos os aparelhos, as pizzas voltam a 8 fatias e as estatísticas são zeradas. Essa ação não pode ser desfeita.",
      botao: "Limpar pedidos"
    });
    if (!ok) return;
    const u = { solicitacoes: null, estatisticas: null };
    for (const p of PIZZAS) u[`estoque/${p.id}`] = { produtoId: p.id, ...estoqueZerado((S.estoque[p.id]?.ciclo || 1) + 1) };
    for (let n = 1; n <= TOTAL_MESAS; n++) u[`mesas/${mesaIdDe(n)}/inicioAtendimento`] = serverTimestamp();
    try { await update(ref(db, RAIZ), u); toast("Pedidos de teste apagados."); }
    catch (e) { console.warn(e); toast("Não foi possível limpar agora."); }
  }
  async function reiniciarDemo() {
    const ok = await confirmar({
      titulo: "Reiniciar a demonstração?",
      texto: "Apaga solicitações, estatísticas, atividade, registros de estoque e preferências \"Não recomendar\". Todas as pizzas voltam a 8 fatias e todas as mesas são liberadas. Essa ação não pode ser desfeita.",
      botao: "Reiniciar tudo"
    });
    if (!ok) return;
    const u = { solicitacoes: null, estatisticas: null, atividade: null, eventosEstoque: null, preferencias: null, "config/reiniciadoEm": serverTimestamp() };
    for (const p of PIZZAS) u[`estoque/${p.id}`] = { produtoId: p.id, ...estoqueZerado(1) };
    for (let n = 1; n <= TOTAL_MESAS; n++) u[`mesas/${mesaIdDe(n)}/inicioAtendimento`] = serverTimestamp();
    try { await update(ref(db, RAIZ), u); toast("Demonstração reiniciada."); fechar("telaDemo"); }
    catch (e) { console.warn(e); toast("Não foi possível reiniciar agora."); }
  }

  /* ============================================================================
     12) CAMADAS, CONFIRMAÇÃO, TOASTS, SOM
     ============================================================================ */
  const pilha = [];
  function abrir(id) { document.getElementById(id).hidden = false; if (!pilha.includes(id)) pilha.push(id); }
  function fechar(id) {
    document.getElementById(id).hidden = true;
    const i = pilha.indexOf(id); if (i >= 0) pilha.splice(i, 1);
    if (id === "telaMesa") S.mesaAberta = null;
  }
  let resolverConfirma = null;
  function confirmar({ titulo, texto, botao = "Confirmar" }) {
    $("#confTitulo").textContent = titulo;
    $("#confTexto").textContent = texto;
    $("#confSim").textContent = botao;
    abrir("telaConfirma");
    setTimeout(() => $("#confNao").focus(), 30);
    return new Promise(res => { resolverConfirma = res; });
  }
  function responderConfirma(v) { fechar("telaConfirma"); resolverConfirma?.(v); resolverConfirma = null; }

  function toast(msg, acao, fn) {
    const box = $("#toasts");
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = `<span>${esc(msg)}</span>${acao ? `<button type="button">${esc(acao)}</button>` : ""}`;
    if (acao) t.querySelector("button").onclick = () => { fn?.(); t.remove(); };
    box.appendChild(t);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => t.remove(), acao ? 7000 : 5000);
  }

  let audioCtx = null;
  function bip() {
    if (!S.som) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      [0, 0.2].forEach(d => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.15);
        o.start(t + d); o.stop(t + d + 0.17);
      });
    } catch {}
  }
  function atualizarBotaoSom() {
    const b = $("#btnSom");
    b.setAttribute("aria-pressed", String(S.som));
    b.textContent = S.som ? "🔔 Som" : "🔕 Som";
  }

  /* ============================================================================
     13) EVENTOS DA INTERFACE
     ============================================================================ */
  function trocarModo(m) {
    S.modo = m; ls.set("rodizio.op.modo", m);
    document.querySelectorAll(".modo").forEach(b => b.setAttribute("aria-selected", String(b.dataset.modo === m)));
    $("#modoGarcom").hidden = m !== "garcom";
    $("#modoGestao").hidden = m !== "gestao";
    $("#garcomConteudo")._html = null; $("#feed")._html = null;
    agendarRender();
  }
  function ligarEventos() {
    document.querySelectorAll(".modo").forEach(b => b.addEventListener("click", () => trocarModo(b.dataset.modo)));
    document.querySelectorAll("[data-visao]").forEach(b => b.addEventListener("click", () => {
      S.visao = b.dataset.visao; ls.set("rodizio.op.visao", S.visao);
      document.querySelectorAll("[data-visao]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      agendarRender();
    }));
    $("#filtros").addEventListener("click", e => {
      const b = e.target.closest("[data-filtro]"); if (!b) return;
      S.filtro = b.dataset.filtro; ls.set("rodizio.op.filtro", S.filtro);
      montarFiltros(); agendarRender();
    });

    $("#garcomConteudo").addEventListener("click", e => {
      const b = e.target.closest("[data-acao]"); if (!b || b.disabled) return;
      const id = b.dataset.id;
      switch (b.dataset.acao) {
        case "atender": atender(id); break;
        case "concluir": concluir(id); break;
        case "cancelar":
          if (S.confirmandoCancel !== id) {
            S.confirmandoCancel = id; agendarRender();
            setTimeout(() => { if (S.confirmandoCancel === id) { S.confirmandoCancel = null; agendarRender(); } }, 4000);
          } else { S.confirmandoCancel = null; cancelarAdm(id); }
          break;
        case "atender-todas": {
          const ids = b.dataset.ids.split(",").filter(Boolean);
          emLote(ids, atender).then(() => toast(`Atendimento iniciado para ${ids.length} mesas.`));
          break;
        }
        case "concluir-todas": {
          const ids = b.dataset.ids.split(",").filter(Boolean);
          emLote(ids, concluir).then(() => toast(`✓ ${ids.length} atendimentos concluídos.`));
          break;
        }
      }
    });

    $("#mesasGrid").addEventListener("click", e => { const b = e.target.closest("[data-mesa]"); if (b) abrirMesa(b.dataset.mesa); });
    $("#mesaLiberar").onclick = () => S.mesaAberta && liberarMesa(S.mesaAberta);

    $("#btnSom").onclick = () => {
      S.som = !S.som; ls.set("rodizio.op.som", S.som ? "1" : "0"); atualizarBotaoSom();
      if (S.som) { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {} bip(); }
    };
    $("#btnDemo").onclick = () => { renderDemoConexao(); abrir("telaDemo"); };
    $("#demoRepor").onclick = async () => {
      const id = $("#demoPizza").value; const p = PRODUTO[id];
      if (!p || !S.conectado) { toast("Sem conexão com o banco."); return; }
      try {
        const n = await reporManual(id);
        toast(`🔥 ${p.nome} reposta.${n ? ` ${n} ${n === 1 ? "mesa em espera foi atendida" : "mesas em espera foram atendidas"} primeiro.` : ""}`);
      } catch (e) { console.warn(e); toast("Não foi possível repor agora."); }
    };
    $("#demoLimpar").onclick = limparPedidos;
    $("#demoReiniciar").onclick = reiniciarDemo;

    $("#confSim").onclick = () => responderConfirma(true);
    $("#confNao").onclick = () => responderConfirma(false);
    document.querySelectorAll("[data-fechar]").forEach(b => b.addEventListener("click", () => fechar(b.dataset.fechar)));
    ["telaDemo", "telaMesa"].forEach(id => document.getElementById(id).addEventListener("click", e => { if (e.target.id === id) fechar(id); }));
    $("#telaConfirma").addEventListener("click", e => { if (e.target.id === "telaConfirma") responderConfirma(false); });
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape" || !pilha.length) return;
      const topo = pilha[pilha.length - 1];
      if (topo === "telaConfirma") responderConfirma(false); else if (topo !== "telaConfig") fechar(topo);
    });
  }

  function relogio() { $("#relogio").textContent = new Date(agoraServidor()).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }

  /* Tarefas periódicas: tempos de espera, destaques e verificação interna de reposição */
  function tick() {
    relogio();
    if (!db) return;
    for (const p of PIZZAS) {
      const e = S.estoque[p.id];
      if (e && (Number(e.disponivel) || 0) === 0 && (!e.zeradoEm || agoraServidor() - e.zeradoEm >= REPOSICAO_MS)) reporPizza(p.id);
    }
    for (const [id, t] of S.novos) if (Date.now() - t > 9000) S.novos.delete(id);
    agendarRender();
  }

  /* ============================================================================
     14) INICIALIZAÇÃO
     ============================================================================ */
  function iniciar() {
    $("#marcaNome").textContent = NOME_RESTAURANTE;
    $("#linkCliente").textContent = location.origin + location.pathname;
    $("#linkOperacao").textContent = location.origin + location.pathname + "#operacao";
    montarFiltros(); montarDemo(); atualizarBotaoSom(); ligarEventos(); relogio();
    document.querySelectorAll("[data-visao]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.visao === S.visao)));
    trocarModo(S.modo);

    const pendente = Object.values(firebaseConfig).some(v => typeof v !== "string" || !v.trim() || v.includes("COLE_AQUI"));
    if (pendente) { console.warn("[operação] Preencha o firebaseConfig."); abrir("telaConfig"); return; }
    try { db = getDatabase(initializeApp(firebaseConfig)); }
    catch (e) { console.error("[operação] Falha ao iniciar o Firebase. Verifique o firebaseConfig.", e); abrir("telaConfig"); return; }
    ouvir();
    setInterval(tick, 5000);
  }
  iniciar();

}

/* ---------------------------------------------------------------------------
   Inicialização: coloca a tela escolhida na página e inicia a aplicação dela.
   --------------------------------------------------------------------------- */
const tpl = document.getElementById(MODO_OPERACAO ? "tpl-operacao" : "tpl-cliente");
document.body.appendChild(tpl.content.cloneNode(true));
document.title = MODO_OPERACAO ? "Operação | Rodízio" : "Cardápio da mesa | Rodízio";
if (MODO_OPERACAO) appOperacao(); else appCliente();
</script>
</body>
</html>
